<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>radar — trendscope</title>
  <link rel="search" type="application/opensearchdescription+xml" title="trendscope" href="opensearch.xml">
  <link rel="alternate" type="application/rss+xml" title="trendscope snapshots" href="feed.xml">
  <link rel="alternate" type="application/feed+json" title="trendscope snapshots" href="feed.json">
<meta name="description" content="Breakout radar: items first-seen today, one-day spikes, cross-source spread and brand-new domains on the board.">
<meta property="og:title" content="radar — trendscope">
<meta property="og:description" content="What is breaking out right now: fresh items, spikes, crossovers and new domains.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://zalize-com.github.io/trendscope/radar.html">
<meta property="og:image" content="https://zalize-com.github.io/trendscope/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📡</text></svg>">
<style>
  :root { --bg:#0d1117; --fg:#e6edf3; --dim:#8b949e; --border:#21262d; --accent:#58a6ff;
          --green:#3fb950; --orange:#d29922; }
  body { background: var(--bg); color: var(--fg);
         font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
         max-width: 860px; margin: 0 auto; padding: 28px 18px 60px; }
  a { color: var(--accent); text-decoration: none; } a:hover { text-decoration: underline; }
  nav a { color: var(--dim); font-size: 13px; }
  h1 { font-size: 26px; margin: 14px 0 4px; } h1 span { color: var(--accent); }
  .sub { color: var(--dim); margin-bottom: 18px; }
  .stats { display: flex; gap: 18px; flex-wrap: wrap; margin: 10px 0 6px; }
  .stat b { font-size: 22px; } .stat small { color: var(--dim); display: block; font-size: 11px; }
  h2 { font-size: 15px; color: var(--dim); font-weight: 600; margin: 26px 0 6px;
       text-transform: uppercase; letter-spacing: .04em; }
  ol { list-style: none; }
  li { display: flex; gap: 10px; padding: 5px 0; border-bottom: 1px solid var(--border); align-items: baseline; }
  .it a { color: var(--fg); } .it a:hover { color: var(--accent); }
  .sc { margin-left: auto; white-space: nowrap; font-size: 12px; color: var(--dim); }
  .date { color: var(--dim); font-size: 11px; }
  footer { margin-top: 40px; padding-top: 16px; border-top: 1px solid var(--border); color: var(--dim); font-size: 12px; }
  #err { color: var(--dim); }
  .chip { display:inline-block; padding:2px 9px; border:1px solid var(--border); border-radius:12px; font-size:12px; color:var(--fg); text-decoration:none; margin:2px 3px 2px 0; opacity:.75; }
  .chip.on { opacity:1; border-color:var(--accent); color:var(--accent); }
  .bars { display:flex; gap:3px; align-items:flex-end; height:44px; margin:6px 0; }
  .bar { flex:1; background:var(--accent); opacity:.7; border-radius:2px 2px 0 0; min-height:2px; }
  .blabels { display:flex; gap:3px; font-size:9px; color:var(--dim); font-family:ui-monospace,monospace; }
  .blabels span { flex:1; text-align:center; }

  /* a11y floor: focus ring + reduced motion (hallmark-style audit 2026-11-16) */
  :focus-visible { outline: 2px solid var(--accent, #58a6ff); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>
  <nav><a href="index.html">← trendscope</a> · <a href="new.html">new</a> · <a href="risers.html">risers</a> · <a href="crossovers.html">crossovers</a></nav>
  <h1>ra<span>dar</span></h1>
  <p class="sub">The breakout lane — what appeared today, what is spiking, what is jumping between sources. <a href="docs/api/new.json" style="color:var(--accent)">↓ json</a></p>
  <div id="srcbar" style="margin:8px 0"></div>
  <div class="stats" id="stats"></div>
  <div id="out"><p id="err">loading…</p></div>
  <footer>Open data, <a href="https://creativecommons.org/publicdomain/zero/1.0/">CC0</a> ·
    <a href="https://github.com/zalize-com/trendscope">github.com/zalize-com/trendscope</a></footer>
<script type="module">
const esc = s => { const d = document.createElement("div"); d.textContent = s||""; return d.innerHTML; };
const fmt = n => n >= 1e6 ? (n/1e6).toFixed(1)+"M" : n >= 1e3 ? (n/1e3).toFixed(1)+"k" : String(n);
const $ = id => document.getElementById(id);
try {
  const [nw, ri, cr, ser] = await Promise.all([
    fetch("docs/api/new.json", {cache:"no-cache"}).then(r => r.json()),
    fetch("docs/api/risers.json", {cache:"no-cache"}).then(r => r.json()),
    fetch("docs/api/crossovers.json", {cache:"no-cache"}).then(r => r.json()),
    fetch("docs/api/series.json", {cache:"no-cache"}).then(r => r.json()),
  ]);
  const latest = nw.latest_snapshot;
  const fresh = nw.items.slice().sort((a,b) => (b.score||0)-(a.score||0));
  const hot = ri.single_day_spikes.filter(x => x.date === latest)
    .concat(ri.sustained_climbers.slice(0, 8).map(c => ({title: c.title, url: c.url, source: c.source, delta: c.gain, date: latest})))
    .sort((a,b) => b.delta - a.delta);
  const cross = cr.crossovers;
  const SKIP = new Set(["news.ycombinator.com","github.com","www.npmjs.com","pypi.org","crates.io","dev.to","lobste.rs"]);
  const hostOf = u => { try { return new URL(u).hostname.replace(/^www\./,""); } catch(e) { return ""; } };
  const domFirst = {};
  for (const [url, it] of Object.entries(ser.items)) {
    const h = hostOf(url); if (!h || SKIP.has(h)) continue;
    const first = Object.keys(it.days).sort()[0];
    if (!domFirst[h] || first < domFirst[h].first) domFirst[h] = { first, url, title: it.title, source: it.source };
  }
  const newDoms = Object.entries(domFirst).filter(([,v]) => v.first === latest)
    .sort((a,b) => a[0].localeCompare(b[0]));

  $("stats").innerHTML =
    `<div class="stat"><b>${latest}</b><small>latest snapshot</small></div>
     <div class="stat"><b class="up">${nw.new_items}</b><small>first-seen items today</small></div>
     <div class="stat"><b>${hot.length}</b><small>heating up today</small></div>
     <div class="stat"><b>${cross.length}</b><small>crossovers (all time)</small></div>
     <div class="stat"><b>${newDoms.length}</b><small>new domains today</small></div>`;

  const row = (e, badge) =>
    `<li><span class="it"><a href="${e.url}">${esc(e.title.length>80?e.title.slice(0,80)+"…":e.title)}</a><span class="src">${e.source}</span>
     <a href="item.html?q=${encodeURIComponent(e.title)}" title="score trajectory" style="color:var(--dim);text-decoration:none;margin-left:4px">⤳</a></span>
     <span class="sc">${badge}</span></li>`;

  $("out").innerHTML =
    `<h2>fresh on the board today</h2><ol>` +
      (fresh.slice(0,20).map(e => row(e, `<span class="up">${fmt(e.score||0)}</span> ${e.metric||""}`)).join("")
        || `<li><span class="it" style="color:var(--dim)">nothing new today</span></li>`) + `</ol>` +
    `<h2>heating up — gains in the last 24h</h2><ol>` +
      (hot.slice(0,12).map(e => row(e, `<span class="up">+${fmt(e.delta)}</span>`)).join("")
        || `<li><span class="it" style="color:var(--dim)">no spikes today</span></li>`) + `</ol>` +
    `<h2>crossing over — on 2+ sources</h2><ol>` +
      (cross.slice(0,10).map(c => row({title: c.title, url: c.url, source: c.sources.join(" + ")},
        `${fmt(c.best.score)} ${c.best.metric}`)).join("")
        || `<li><span class="it" style="color:var(--dim)">none yet</span></li>`) + `</ol>` +
    `<h2>new neighborhoods — domains first seen today</h2><ol>` +
      (newDoms.slice(0,15).map(([h, v]) => row({title: h, url: v.url, source: v.source},
        `<a href="domain.html?d=${encodeURIComponent(h)}" style="color:var(--dim)">deep dive →</a>`)).join("")
        || `<li><span class="it" style="color:var(--dim)">no new domains today</span></li>`) + `</ol>`;
} catch (e) { $("err").textContent = "data unavailable: " + e; }
</script>
</body>
</html>
