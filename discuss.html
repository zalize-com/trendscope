<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>discussed — trendscope</title>
<meta name="description" content="The most-discussed items across all daily snapshots — and the most heated: high comment-per-point ratios.">
<meta property="og:title" content="trendscope discussed — comment leaderboards">
<meta property="og:image" content="og.png">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📡</text></svg>">
<style>
  :root { --bg:#0d1117; --panel:#161b22; --border:#30363d; --fg:#e6edf3;
          --dim:#8b949e; --accent:#58a6ff; --green:#3fb950; --red:#f85149; --orange:#d29922; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--fg);
         font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
         max-width: 860px; margin: 0 auto; padding: 28px 18px 60px; }
  a { color: var(--accent); text-decoration: none; } a:hover { text-decoration: underline; }
  nav a { color: var(--dim); font-size: 13px; }
  h1 { font-size: 26px; margin: 14px 0 4px; } h1 span { color: var(--accent); }
  .sub { color: var(--dim); margin-bottom: 18px; }
  .stats { display: flex; gap: 18px; flex-wrap: wrap; margin: 10px 0 6px; }
  .stat b { font-size: 22px; } .stat small { color: var(--dim); display: block; font-size: 11px; }
  h2 { font-size: 15px; color: var(--dim); font-weight: 600; margin: 26px 0 6px;
       text-transform: uppercase; letter-spacing: .04em; }
  ol { list-style: none; }
  li { display: flex; gap: 10px; padding: 5px 0; border-bottom: 1px solid var(--border); align-items: baseline; }
  .it a { color: var(--fg); } .it a:hover { color: var(--accent); }
  .src { color: var(--dim); font-size: 11px; border: 1px solid var(--border);
         border-radius: 4px; padding: 0 5px; margin-left: 6px; }
  .sc { margin-left: auto; white-space: nowrap; font-size: 12px; color: var(--dim); }
  .hot { color: var(--orange); font-weight: 600; }
  .trj { color: var(--dim); font-size: 11px; margin-left: 6px; text-decoration: none; }
  .trj:hover { color: var(--accent); }
  footer { margin-top: 40px; padding-top: 16px; border-top: 1px solid var(--border); color: var(--dim); font-size: 12px; }
  #err { color: var(--dim); }
</style>
</head>
<body>
  <nav><a href="index.html">← trendscope</a> · <a href="domains.html">domains</a> · <a href="authors.html">authors</a></nav>
  <h1>disc<span>ussed</span></h1>
  <p class="sub">Comment leaderboards across all daily snapshots — deduped by URL, peak comment count wins.
    "Heated" = comments-per-point ratio (score ≥ 50): high debate relative to attention.
    <a href="docs/api/discussed.json">↓ json</a></p>
  <div class="stats" id="stats"></div>
  <div id="out"><p id="err">loading…</p></div>
  <footer>Open data, <a href="https://creativecommons.org/publicdomain/zero/1.0/">CC0</a> ·
    <a href="https://github.com/zalize-com/trendscope">github.com/zalize-com/trendscope</a></footer>
<script type="module">
const esc = s => { const d = document.createElement("div"); d.textContent = s||""; return d.innerHTML; };
const fmt = n => n >= 1e3 ? (n/1e3).toFixed(1)+"k" : String(n);
const $ = id => document.getElementById(id);

const data = await fetch("docs/api/discussed.json", {cache:"no-cache"}).then(r => r.json()).catch(() => null);
if (!data) { $("err").textContent = "could not load docs/api/discussed.json"; throw 0; }

const srcs = new Set(data.discussed.map(x => x.source));
$("stats").innerHTML =
  `<div class="stat"><b>${data.total}</b><small>commented items</small></div>` +
  `<div class="stat"><b>${data.discussed[0] ? fmt(data.discussed[0].comments) : 0}</b><small>top comment count</small></div>` +
  `<div class="stat"><b>${srcs.size}</b><small>sources with comments</small></div>`;

function row(it, right) {
  return `<li><span class="it"><a href="${it.url}">${esc(it.title)}</a><span class="src">${it.source}</span>` +
    `<a class="trj" href="item.html?q=${encodeURIComponent(it.title)}" title="trajectory">⤳</a></span>` +
    `<span class="sc">${right}</span></li>`;
}

const d = data.discussed, h = data.heated;
$("out").innerHTML =
  `<h2>most discussed</h2><ol>` +
  d.map(it => row(it, `💬 ${fmt(it.comments)} · ${fmt(it.score)} ${it.metric||""} · ${it.date}`)).join("") + `</ol>` +
  `<h2>heated — comments per point (score ≥ 50)</h2><ol>` +
  h.map(it => row(it, `<span class="hot">${(it.comments/Math.max(1,it.score)).toFixed(1)}×</span> 💬${fmt(it.comments)} · ${fmt(it.score)}pts`)).join("") + `</ol>`;
</script>
</body>
</html>
