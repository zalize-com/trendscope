<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>new today — trendscope</title>
  <link rel="search" type="application/opensearchdescription+xml" title="trendscope" href="opensearch.xml">
  <link rel="alternate" type="application/rss+xml" title="trendscope snapshots" href="feed.xml">
  <link rel="alternate" type="application/feed+json" title="trendscope snapshots" href="feed.json">
<meta name="description" content="Items on today’s boards that have never appeared in the trendscope history before — true first-seen entries.">
<meta property="og:title" content="trendscope — new today">
<meta property="og:image" content="https://zalize-com.github.io/trendscope/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📡</text></svg>">
<style>
  :root { --bg:#0d1117; --panel:#161b22; --border:#30363d; --fg:#e6edf3;
          --dim:#8b949e; --accent:#58a6ff; --green:#3fb950; --orange:#d29922; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--fg);
         font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
         max-width: 860px; margin: 0 auto; padding: 28px 18px 60px; }
  a { color: var(--accent); text-decoration: none; } a:hover { text-decoration: underline; }
  nav a { color: var(--dim); font-size: 13px; }
  h1 { font-size: 26px; margin: 14px 0 4px; } h1 span { color: var(--accent); }
  .sub { color: var(--dim); margin-bottom: 18px; }
  h2 { font-size: 15px; color: var(--dim); font-weight: 600; margin: 26px 0 6px;
       text-transform: uppercase; letter-spacing: .04em; }
  table { border-collapse: collapse; width: 100%; font-size: 12px; }
  td, th { border: 1px solid var(--border); padding: 3px 4px; text-align: center; }
  th { color: var(--dim); font-weight: 600; }
  td.src { color: var(--dim); text-align: left; padding-left: 8px; white-space: nowrap; }
  td.c { color: var(--fg); }
  footer { margin-top: 40px; padding-top: 16px; border-top: 1px solid var(--border); color: var(--dim); font-size: 12px; }
  #err { color: var(--dim); }

  /* a11y floor: focus ring + reduced motion (hallmark-style audit 2026-11-16) */
  :focus-visible { outline: 2px solid var(--accent, #58a6ff); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>
  <nav><a href="index.html">← trendscope</a> · <a href="risers.html">risers</a> · <a href="movers.html">movers</a> · <a href="week.html">this week</a></nav>
  <h1 id="h1">new <span>today</span></h1>
  <div class="sub" id="sub">loading…</div>
  <div class="sub" style="margin-top:-12px"><a href="docs/api/new.json">↓ new.json</a> · <a href="api.html">api</a></div>
  <div id="daystrip"></div>
  <h2>first seen today</h2>
  <ol id="out"><li id="err">loading…</li></ol>
  <footer>
    Computed in your browser from <a href="data/history.csv">history.csv</a> capture timestamps — when each snapshot first saw an item. ·
    <a href="https://github.com/zalize-com/trendscope">trendscope</a>
  </footer>
<script>
const esc = s => { const d = document.createElement("div"); d.textContent = s||""; return d.innerHTML; };
const fmt = n => n >= 1e9 ? (n/1e9).toFixed(1)+"B" : n >= 1e6 ? (n/1e6).toFixed(1)+"M" : n >= 1e3 ? (n/1e3).toFixed(1)+"k" : String(n);
function parseCSV(txt) {
  const rows = []; let f = "", row = [], q = false;
  for (let i = 0; i <= txt.length; i++) {
    const c = txt[i];
    if (q) {
      if (c === '"') { if (txt[i+1] === '"') { f += '"'; i++; } else q = false; }
      else if (c === undefined) {} else f += c;
    } else if (c === '"') q = true;
    else if (c === ',' ) { row.push(f); f = ""; }
    else if (c === '\n' || c === undefined) { row.push(f); f = ""; rows.push(row); row = []; }
    else if (c !== '\r') f += c;
  }
  return rows.filter(r => r.length > 1);
}
Promise.all([
  fetch("data/latest.json", {cache:"no-cache"}).then(r => r.json()),
  fetch("docs/api/series.json", {cache:"no-cache"}).then(r => r.json()),
]).then(([snap, txt]) => {
  const today = (snap.date || snap.generated_at || "").slice(0,10);
  const seenBefore = new Set();
  for (const [url, it] of Object.entries(txt.items)) {
    for (const d of Object.keys(it.days)) if (d < today) { seenBefore.add(it.source + "|" + url); break; }
  }
  const items = Array.isArray(snap.items) ? snap.items
    : Object.entries(snap.items || {}).flatMap(([src, list]) =>
        (Array.isArray(list) ? list : []).map(i => ({...i, source: i.source || src})));
  const fresh = items.filter(i => i.url && !seenBefore.has(i.source + "|" + i.url));
  const bySrc = {};
  for (const i of fresh) (bySrc[i.source] = bySrc[i.source]||[]).push(i);
  document.getElementById("sub").innerHTML =
    `<b>${fresh.length}</b> of ${items.length} board items are first-seen today (${(100*fresh.length/Math.max(items.length,1)).toFixed(0)}%) · snapshot ${today}`;
  document.getElementById("out").innerHTML = Object.entries(bySrc)
    .sort((a,b)=>b[1].length-a[1].length).map(([src,list]) =>
      `<li style="display:block;padding:8px 0"><b style="color:var(--dim)">${esc(src)} · ${list.length} new</b>` +
      list.map(i => `<div style="display:flex;gap:8px;padding:3px 0 3px 14px;border-bottom:1px solid var(--border)">
        <a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.title)}</a>
        <span style="margin-left:auto;color:var(--dim);font-size:12px;white-space:nowrap">#${i.rank||"—"} ${fmt(i.score)}</span></div>`).join("") + `</li>`).join("")
    || `<li id="err">nothing new — every board item has been seen before</li>`;
}).catch(() => { document.getElementById("err").textContent = "data unavailable"; });
</script>
</body>
</html>
