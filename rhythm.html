<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>capture rhythm — trendscope</title>
  <link rel="search" type="application/opensearchdescription+xml" title="trendscope" href="opensearch.xml">
  <link rel="alternate" type="application/rss+xml" title="trendscope snapshots" href="feed.xml">
  <link rel="alternate" type="application/feed+json" title="trendscope snapshots" href="feed.json">
<meta name="description" content="When do front-page items get captured? Hour-of-day × source heatmap from the trendscope history.">
<meta property="og:title" content="trendscope — capture rhythm">
<meta property="og:image" content="https://zalize-com.github.io/trendscope/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📡</text></svg>">
<style>
  :root { --bg:#0d1117; --panel:#161b22; --border:#30363d; --fg:#e6edf3;
          --dim:#8b949e; --accent:#58a6ff; --green:#3fb950; --orange:#d29922; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--fg);
         font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
         max-width: 860px; margin: 0 auto; padding: 28px 18px 60px; }
  a { color: var(--accent); text-decoration: none; } a:hover { text-decoration: underline; }
  nav a { color: var(--dim); font-size: 13px; }
  h1 { font-size: 26px; margin: 14px 0 4px; } h1 span { color: var(--accent); }
  .sub { color: var(--dim); margin-bottom: 18px; }
  h2 { font-size: 15px; color: var(--dim); font-weight: 600; margin: 26px 0 6px;
       text-transform: uppercase; letter-spacing: .04em; }
  table { border-collapse: collapse; width: 100%; font-size: 12px; }
  td, th { border: 1px solid var(--border); padding: 3px 4px; text-align: center; }
  th { color: var(--dim); font-weight: 600; }
  td.src { color: var(--dim); text-align: left; padding-left: 8px; white-space: nowrap; }
  td.c { color: var(--fg); }
  footer { margin-top: 40px; padding-top: 16px; border-top: 1px solid var(--border); color: var(--dim); font-size: 12px; }
  #err { color: var(--dim); }
</style>
</head>
<body>
  <nav><a href="index.html">← trendscope</a> · <a href="calendar.html">calendar</a> · <a href="week.html">this week</a> · <a href="stats.html">stats</a></nav>
  <h1 id="h1">capture <span>rhythm</span></h1>
  <div class="sub" id="sub">loading…</div>
  <h2>hour-of-day × source (UTC)</h2>
  <div id="grid"><p id="err">loading…</p></div>
  <h2>reading the board</h2>
  <div id="notes" style="color:var(--dim);font-size:13px"></div>
  <footer>
    Computed in your browser from <a href="data/history.csv">history.csv</a> capture timestamps — when each snapshot first saw an item. ·
    <a href="https://github.com/zalize-com/trendscope">trendscope</a>
  </footer>
<script>
const esc = s => { const d = document.createElement("div"); d.textContent = s||""; return d.innerHTML; };
fetch("docs/api/rhythm.json", {cache:"no-cache"}).then(r => r.json()).then(d => {
  const grid = {}, totals = {};
  for (const [s, v] of Object.entries(d.sources)) {
    grid[s] = Object.fromEntries(v.counts.map((c, i) => [i, c]));
    totals[s] = v.total;
  }
  const srcs = Object.keys(totals).sort((a,b)=>totals[b]-totals[a]);
  const max = Math.max(...srcs.flatMap(s=>Object.values(grid[s]||{})),1);
  const hr = [...Array(24).keys()];
  let h = '<table><tr><th>source</th>' + hr.map(x=>`<th>${String(x).padStart(2,"0")}</th>`).join("") + '<th>total</th></tr>';
  for (const s of srcs) {
    h += `<tr><td class="src">${esc(s)}</td>`;
    for (const x of hr) {
      const v = (grid[s]||{})[x] || 0;
      const a = v ? (0.12 + 0.88*v/max).toFixed(2) : 0;
      h += `<td class="c" title="${v} captures at ${String(x).padStart(2,"0")}:00 UTC" style="background:rgba(88,166,255,${a})">${v||""}</td>`;
    }
    h += `<td class="c">${totals[s]}</td></tr>`;
  }
  document.getElementById("grid").innerHTML = h + "</table>";
  const peaks = srcs.slice(0,4).map(s => {
    const ent = Object.entries(grid[s]||{}).sort((a,b)=>b[1]-a[1]);
    return `${esc(s)} peaks ${String(ent[0]?.[0]).padStart(2,"0")}:00 UTC`;
  }).join(" · ");
  const tot = Object.values(totals).reduce((a,b)=>a+b,0);
  document.getElementById("sub").textContent = `${tot} captures · ${srcs.length} sources · ${d.days_tracked} days · UTC hours`;
  const ne = document.getElementById("notes"); if (ne) ne.innerHTML = peaks;
}).catch(() => { document.getElementById("err").textContent = "rhythm.json unavailable"; });
</script>
</body>
</html>
