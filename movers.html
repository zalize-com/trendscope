<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>movers — trendscope</title>
<meta name="description" content="What entered, left, climbed and dropped between the last two trendscope daily snapshots — the board's daily diff.">
<meta property="og:title" content="trendscope movers — daily board diff">
<meta property="og:image" content="og.png">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📡</text></svg>">
<style>
  :root { --bg:#0d1117; --panel:#161b22; --border:#30363d; --fg:#e6edf3;
          --dim:#8b949e; --accent:#58a6ff; --green:#3fb950; --red:#f85149; --orange:#d29922; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--fg);
         font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
         max-width: 860px; margin: 0 auto; padding: 28px 18px 60px; }
  a { color: var(--accent); text-decoration: none; } a:hover { text-decoration: underline; }
  nav a { color: var(--dim); font-size: 13px; }
  h1 { font-size: 26px; margin: 14px 0 4px; } h1 span { color: var(--accent); }
  .sub { color: var(--dim); margin-bottom: 18px; }
  .stats { display: flex; gap: 18px; flex-wrap: wrap; margin: 10px 0 6px; }
  .stat b { font-size: 22px; } .stat small { color: var(--dim); display: block; font-size: 11px; }
  h2 { font-size: 15px; color: var(--dim); font-weight: 600; margin: 26px 0 6px;
       text-transform: uppercase; letter-spacing: .04em; }
  ol { list-style: none; }
  li { display: flex; gap: 10px; padding: 5px 0; border-bottom: 1px solid var(--border); align-items: baseline; }
  .it a { color: var(--fg); } .it a:hover { color: var(--accent); }
  .src { color: var(--dim); font-size: 11px; border: 1px solid var(--border);
         border-radius: 4px; padding: 0 5px; margin-left: 6px; }
  .sc { margin-left: auto; white-space: nowrap; font-size: 12px; color: var(--dim); }
  .up { color: var(--green); font-weight: 600; } .down { color: var(--red); font-weight: 600; }
  .trj { color: var(--dim); font-size: 11px; margin-left: 6px; text-decoration: none; }
  .trj:hover { color: var(--accent); }
  select { background: var(--panel); color: var(--fg); border: 1px solid var(--border);
           border-radius: 6px; padding: 3px 8px; font: inherit; }
  footer { margin-top: 40px; padding-top: 16px; border-top: 1px solid var(--border); color: var(--dim); font-size: 12px; }
  #err { color: var(--dim); }
</style>
</head>
<body>
  <nav><a href="index.html">← trendscope</a> · <a href="compare.html">compare</a> · <a href="risers.html">risers</a></nav>
  <h1>m<span>overs</span></h1>
  <p class="sub">What changed between daily snapshots — entered, left, climbed and dropped, plus package rank shifts.
    <a href="docs/api/movers-latest.json">↓ json</a> · <a href="docs/movers/">md archive</a></p>
  <p style="font-size:12px;color:var(--dim)">snapshot pair: <select id="dpick"></select></p>
  <div class="stats" id="stats"></div>
  <div id="out"><p id="err">loading…</p></div>
  <footer>Open data, <a href="https://creativecommons.org/publicdomain/zero/1.0/">CC0</a> ·
    <a href="https://github.com/zalize-com/trendscope">github.com/zalize-com/trendscope</a></footer>
<script type="module">
const esc = s => { const d = document.createElement("div"); d.textContent = s||""; return d.innerHTML; };
const fmt = n => {
  const s = n < 0 ? "-" : "", a = Math.abs(n);
  return s + (a >= 1e9 ? (a/1e9).toFixed(1)+"B" : a >= 1e6 ? (a/1e6).toFixed(1)+"M" : a >= 1e3 ? (a/1e3).toFixed(1)+"k" : String(a));
};
const $ = id => document.getElementById(id);
const P = new URLSearchParams(location.search);

const idx = await fetch("docs/index.json", {cache:"no-cache"}).then(r => r.json()).catch(() => ({}));
const days = (idx.movers || []).slice().reverse(); // newest first
const pick = $("dpick");
pick.innerHTML = `<option value="latest">latest</option>` +
  days.map(d => `<option value="${d}">${d}</option>`).join("");
const want = P.get("d") || "latest";
pick.value = days.includes(want) ? want : "latest";
pick.onchange = () => { history.replaceState(null,"",`?d=${pick.value}`); load(); };

function row(it, right) {
  return `<li><span class="it"><a href="${it.url}">${esc(it.title)}</a><span class="src">${it.source}</span>` +
    `<a class="trj" href="item.html?q=${encodeURIComponent(it.title)}" title="trajectory">⤳</a></span>` +
    `<span class="sc">${right}</span></li>`;
}
function section(title, items, right, cls) {
  if (!items.length) return "";
  return `<h2>${title}</h2><ol>` +
    items.map(it => row(it, `<span class="${cls||''}">${right(it)}</span>`)).join("") + `</ol>`;
}

async function load() {
  const d = pick.value;
  const url = d === "latest" ? "docs/api/movers-latest.json" : `docs/api/movers-${d}.json`;
  $("out").innerHTML = `<p id="err">loading ${d}…</p>`;
  let m;
  try {
    const r = await fetch(url, {cache:"no-cache"});
    if (!r.ok) throw new Error(r.status);
    m = await r.json();
  } catch (e) {
    $("out").innerHTML = `<p id="err">no movers file for ${d} — archive started 2026-11-15; <a href="?d=latest">latest →</a></p>`;
    $("stats").innerHTML = "";
    return;
  }
  $("stats").innerHTML =
    `<div class="stat"><b>${m.entered.length}</b><small>entered</small></div>` +
    `<div class="stat"><b>${m.left.length}</b><small>left</small></div>` +
    `<div class="stat"><b>${m.gainers.length}</b><small>gainers</small></div>` +
    `<div class="stat"><b>${m.droppers.length}</b><small>droppers</small></div>` +
    `<div class="stat"><b>${(m.pkg_rank_up||[]).length + (m.pkg_rank_down||[]).length}</b><small>pkg rank moves</small></div>` +
    `<div class="stat"><b style="font-size:15px">${m.a} → ${m.b}</b><small>snapshot pair</small></div>`;
  $("out").innerHTML =
    section("gainers", m.gainers, it => `+${fmt(it.delta)} <span class="dim">${fmt(it.score)} ${it.metric}</span>`, "up") +
    section("droppers", m.droppers, it => `${fmt(-Math.abs(it.delta))} <span class="dim">${fmt(it.score)} ${it.metric}</span>`, "down") +
    section("entered", m.entered, it => `<span class="up">new</span> · #${it.rank} · ${fmt(it.score)} ${it.metric}`) +
    section("left", m.left, it => `<span class="down">gone</span> · was #${it.rank ?? "?"} · ${fmt(it.score)} ${it.metric}`) +
    section("package rank — climbing", m.pkg_rank_up || [], it => `rank ${it.from} → ${it.to}`, "up") +
    section("package rank — falling", m.pkg_rank_down || [], it => `rank ${it.from} → ${it.to}`, "down") ||
    `<p id="err">empty movers set</p>`;
}
load();
</script>
</body>
</html>
