<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>canon — trendscope</title>
<meta name="description" content="The Hacker News canon: every month's top-10 front-page stories since 2007 — 238 months of tech history, ranked.">
<meta property="og:title" content="trendscope canon — 19 years of HN front pages">
<meta property="og:image" content="og.png">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📡</text></svg>">
<style>
  :root { --bg:#0d1117; --panel:#161b22; --border:#30363d; --fg:#e6edf3;
          --dim:#8b949e; --accent:#58a6ff; --green:#3fb950; --orange:#d29922; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--fg);
         font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
         max-width: 900px; margin: 0 auto; padding: 28px 18px 60px; }
  a { color: var(--accent); text-decoration: none; } a:hover { text-decoration: underline; }
  nav a { color: var(--dim); font-size: 13px; }
  h1 { font-size: 26px; margin: 14px 0 4px; } h1 span { color: var(--accent); }
  .sub { color: var(--dim); margin-bottom: 18px; }
  .stats { display: flex; gap: 22px; flex-wrap: wrap; margin: 10px 0 6px; }
  .stat b { font-size: 24px; } .stat small { color: var(--dim); display: block; font-size: 11px; }
  h2 { font-size: 15px; color: var(--dim); font-weight: 600; margin: 28px 0 8px;
       text-transform: uppercase; letter-spacing: .04em; }
  ol { list-style: none; }
  li { display: flex; gap: 10px; padding: 5px 0; border-bottom: 1px solid var(--border); align-items: baseline; }
  .r { color: var(--dim); min-width: 22px; text-align: right; }
  .it a { color: var(--fg); } .it a:hover { color: var(--accent); }
  .it .yr { color: var(--dim); font-size: 11px; margin-left: 6px; }
  .sc { margin-left: auto; white-space: nowrap; font-size: 12px; color: var(--dim); }
  .sc b { color: var(--orange); font-weight: 600; }
  .cn { display: flex; gap: 8px; flex-wrap: wrap; }
  .cn a { border: 1px solid var(--border); border-radius: 999px; padding: 3px 10px;
          font-size: 12px; color: var(--dim); }
  .cn a.on, .cn a:hover { color: var(--accent); border-color: var(--accent); text-decoration: none; }
  footer { margin-top: 40px; padding-top: 16px; border-top: 1px solid var(--border); color: var(--dim); font-size: 12px; }
</style>
</head>
<body>
  <nav><a href="index.html">← trendscope</a> · <a href="calendar.html">calendar</a> · <a href="streaks.html">streaks</a></nav>
  <h1>the <span>canon</span></h1>
  <p class="sub" id="sub">Every month's top-10 Hacker News front-page stories, backfilled to February 2007 — the tech zeitgeist, month by month.</p>
  <div class="stats" id="stats"></div>
  <h2>this month in history</h2>
  <ol id="timh"></ol>
  <h2>all-time top 40</h2>
  <div class="cn" id="years"></div>
  <ol id="out"></ol>
  <footer>Data: <a href="data/hn-canon-monthly.csv">hn-canon-monthly.csv</a> ·
    <a href="https://github.com/zalize-com/trendscope">github.com/zalize-com/trendscope</a> · CC0</footer>
<script type="module">
const esc = s => { const d = document.createElement("div"); d.textContent = s||""; return d.innerHTML; };
const fmt = n => n >= 1e3 ? (n/1e3).toFixed(1)+"k" : String(n);

function parseCSV(text) {
  const rows = []; let field = "", row = [], inQ = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQ) {
      if (c === '"') { if (text[i+1] === '"') { field += '"'; i++; } else inQ = false; }
      else field += c;
    } else if (c === '"') inQ = true;
    else if (c === ",") { row.push(field); field = ""; }
    else if (c === "\n") { row.push(field); rows.push(row); row = []; field = ""; }
    else if (c !== "\r") field += c;
  }
  if (field || row.length) { row.push(field); rows.push(row); }
  return rows;
}

const text = await fetch("data/hn-canon-monthly.csv", {cache:"no-cache"}).then(r => r.text());
const rows = parseCSV(text).slice(1).filter(r => r.length >= 8 && r[0]);
const canon = rows.map(r => ({ month: r[0], rank: +r[1], title: r[2], url: r[3],
  points: +r[4], comments: +r[5], author: r[6], hn: r[8] }));
const months = [...new Set(canon.map(c => c.month))].sort();
const years = [...new Set(months.map(m => m.slice(0,4)))].sort();

document.getElementById("stats").innerHTML = `
  <div class="stat"><b>${months.length}</b><small>months</small></div>
  <div class="stat"><b>${canon.length}</b><small>stories</small></div>
  <div class="stat"><b>${fmt(canon.reduce((a,c)=>a+c.points,0))}</b><small>total points</small></div>
  <div class="stat"><b>${fmt(Math.max(...canon.map(c=>c.points)))}</b><small>peak score</small></div>`;

// this month in history: rank-1 story of the same month, every year
const curM = months[months.length-1];
const mm = curM.slice(5);
const timh = canon.filter(c => c.month.slice(5) === mm && c.rank === 1 && c.month !== curM)
  .sort((a,b) => b.month.localeCompare(a.month));
document.getElementById("timh").innerHTML = timh.map((c,i) =>
  `<li><span class="r">${c.month.slice(0,4)}</span><span class="it">
   <a href="${c.hn}">${esc(c.title)}</a></span><span class="sc"><b>${fmt(c.points)}</b> pts</span></li>`).join("")
  || '<li class="it" style="color:var(--dim)">no prior years for this month</li>';

// year chips
const P = new URLSearchParams(location.search);
let yr = P.get("y") || "";
document.getElementById("years").innerHTML =
  `<a class="${!yr?"on":""}" href="canon.html">all time</a>` +
  years.map(y => `<a class="${y===yr?"on":""}" href="canon.html?y=${y}">${y}</a>`).join("");

const pool = (yr ? canon.filter(c => c.month.startsWith(yr)) : canon)
  .slice().sort((a,b) => b.points - a.points).slice(0, 40);
document.getElementById("out").innerHTML = pool.map((c,i) =>
  `<li><span class="r">${i+1}</span><span class="it">
   <a href="${c.hn}">${esc(c.title)}</a><span class="yr">${c.month}</span></span>
   <span class="sc"><b>${fmt(c.points)}</b> pts · ${fmt(c.comments)}💬</span></li>`).join("");
</script>
</body>
</html>
