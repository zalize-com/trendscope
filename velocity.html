<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>velocity — trendscope</title>
  <link rel="search" type="application/opensearchdescription+xml" title="trendscope" href="opensearch.xml">
  <link rel="alternate" type="application/rss+xml" title="trendscope snapshots" href="feed.xml">
  <link rel="alternate" type="application/feed+json" title="trendscope snapshots" href="feed.json">
<meta name="description" content="Items that keep climbing — score gained per day for URLs seen on multiple snapshots.">
<meta property="og:title" content="trendscope — velocity">
<meta property="og:image" content="https://zalize-com.github.io/trendscope/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📡</text></svg>">
<style>
  :root { --bg:#0d1117; --panel:#161b22; --border:#30363d; --fg:#e6edf3;
          --dim:#8b949e; --accent:#58a6ff; --green:#3fb950; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--fg);
         font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
         max-width: 860px; margin: 0 auto; padding: 28px 18px 60px; }
  a { color: var(--accent); text-decoration: none; } a:hover { text-decoration: underline; }
  nav a { color: var(--dim); font-size: 13px; }
  h1 { font-size: 26px; margin: 14px 0 4px; } h1 span { color: var(--accent); }
  .sub { color: var(--dim); margin-bottom: 18px; }
  h2 { font-size: 15px; color: var(--dim); font-weight: 600; margin: 26px 0 6px;
       text-transform: uppercase; letter-spacing: .04em; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  td, th { border-bottom: 1px solid var(--border); padding: 5px 6px; text-align: left; }
  th { color: var(--dim); font-weight: 600; font-size: 11px; text-transform: uppercase; }
  td.n { text-align: right; white-space: nowrap; color: var(--green); font-variant-numeric: tabular-nums; }
  td.d { color: var(--dim); font-size: 12px; white-space: nowrap; }
  .src { color: var(--dim); font-size: 10px; border: 1px solid var(--border);
         border-radius: 4px; padding: 0 4px; white-space: nowrap; }
  footer { margin-top: 40px; padding-top: 16px; border-top: 1px solid var(--border); color: var(--dim); font-size: 12px; }
  #err { color: var(--dim); }
</style>
</head>
<body>
  <nav><a href="index.html">← trendscope</a> · <a href="risers.html">risers</a> · <a href="streaks.html">streaks</a> · <a href="weekday.html">weekday</a></nav>
  <h1 id="h1">velocity</h1>
  <div class="sub" id="sub">loading…</div>
  <h2>score gained per day — multi-day items</h2>
  <div id="grid"><p id="err">loading…</p></div>
  <footer>
    Same URL seen on ≥2 snapshot days: (last score − first score) ÷ days between. Computed in your browser from <a href="data/history.csv">history.csv</a>. ·
    <a href="https://github.com/zalize-com/trendscope">trendscope</a>
  </footer>
<script>
const esc = s => { const d = document.createElement("div"); d.textContent = s||""; return d.innerHTML; };
const fmt = n => n >= 1e9 ? (n/1e9).toFixed(1)+"B" : n >= 1e6 ? (n/1e6).toFixed(1)+"M" : n >= 1e3 ? (n/1e3).toFixed(1)+"k" : (Math.round(n*10)/10)+"";
fetch("docs/api/velocity.json", {cache:"no-cache"}).then(r => r.json()).then(d => {
  const top = d.items.slice(0, 40);
  document.getElementById("grid").innerHTML = top.length
    ? '<table><tr><th>#</th><th>title</th><th>+/day</th><th>latest</th><th>days</th></tr>' +
      top.map((it,i) => `<tr><td class="d">${i+1}</td>
        <td><a href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.title)}</a> <span class="src">${esc(it.source)}</span></td>
        <td class="n">+${fmt(it.per_day)} ${esc(it.metric||"")}/d</td>
        <td class="n">${fmt(it.latest)}</td>
        <td class="d">${it.days}d</td></tr>`).join("") + "</table>"
    : '<p id="err">no multi-day items yet — velocity needs items that stay on front pages across snapshots</p>';
  document.getElementById("sub").textContent =
    `${d.total} multi-day items · snapshot ${d.latest_snapshot} · top ${top.length} · rolling counters (npm/pypi/crates) excluded`;
}).catch(() => { document.getElementById("err").textContent = "velocity.json unavailable"; });
</script>
</body>
</html>
