name: daily snapshot

on:
  schedule:
    - cron: "5 6 * * *"   # 06:05 UTC every day
    - cron: "5 18 * * *"  # 18:05 UTC — second pass catches items that arrive late in the day
  workflow_dispatch:       # manual "Run workflow" button
  push:
    paths: ["scripts/**", ".github/workflows/collect.yml"]

permissions:
  contents: write          # to commit the dataset back to the repo

# Only one collect at a time — parallel runs hammer upstream rate limits
# (reddit 429, YouTube blanket-404). A newer push cancels the older run:
# the snapshot is rewritten at the end, so an interrupted run loses nothing.
concurrency:
  group: collect
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/collect.py

      - name: Regenerate weekly digest
        run: python3 scripts/digest.py || true

      - name: Regenerate daily movers
        run: python3 scripts/movers.py || true

      - name: Regenerate weekly movers
        run: MOVERS_WINDOW=7 python3 scripts/movers.py || true

      - name: Regenerate daily brief
        run: python3 scripts/brief.py || true
      - name: Zero-watch (persistent-empty vs tide)
        run: python3 scripts/zerowatch.py --json || true
      - name: Source stats
        run: python3 scripts/sources.py
      - name: Streaks API
        run: python3 scripts/streaks.py
      - name: Risers API
        run: python3 scripts/risers.py
      - name: Aggregates API (domains/authors)
        run: python3 scripts/aggregates.py
      - name: OPML export
        # gen_opml.py also sweeps data-driven feeds_*.json sources;
        # scripts/opml.py only regexes literal collect.py fetchers (3,116 < 9,202)
        run: python3 scripts/gen_opml.py

      - name: Regenerate weekly aggregate API
        run: python3 scripts/weekly.py || true

      - name: Regenerate ideas API
        run: python3 scripts/ideas.py || true

      - name: Track HN hiring threads
        run: python3 scripts/hiring.py || true

      - name: Regenerate RSS feed
        run: python3 scripts/feed.py || true

      - name: Rebuild content index + stats
        run: |
          python3 scripts/content_index.py || true
          python3 scripts/stats.py || true
          python3 scripts/today.py || true

      - name: Regenerate sitemap (fresh lastmod daily)
        run: python3 scripts/gen_sitemap.py

      - name: Check internal links + sitemap
        run: python3 scripts/linkcheck.py

      - name: Validate dataset contract
        run: python3 scripts/validate.py

      - name: Commit dataset
        run: |
          git config user.name "trendscope-bot"
          git config user.email "trendscope-bot@users.noreply.github.com"
          # stage everything the pipeline regenerates — leaving unstaged diffs
          # (trendscope.opml, SOURCES.md, ...) makes `git pull --rebase` refuse
          # and the retry loop below used to end on `sleep 5` = silent green.
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "data: daily snapshot $(date -u +%Y-%m-%d)"
            # retry on push races with concurrent manual pushes; --autostash
            # survives any leftover dirty files instead of refusing outright
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push && break || sleep 5
            done
            # fail loudly if the commit never reached main — a dropped snapshot
            # must not look green
            git fetch -q origin main
            git merge-base --is-ancestor HEAD origin/main || { echo "dataset push never landed"; exit 1; }
          fi
