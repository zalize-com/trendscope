name: site build

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Build site
        working-directory: site
        run: |
          npm ci
          npm run build

      - name: Verify parity-critical output
        run: |
          test -f site/dist/index.html
          test -f site/dist/tools/index.html
          test ! -f site/dist/tools.html
          test -f site/dist/daily/index.html
          test ! -f site/dist/daily.html
          test -f site/dist/daily/sec.html
          grep -q 'class="topbar"' site/dist/index.html
          grep -q 'skiplink' site/dist/index.html
          echo "build sanity: index + tools/index + daily/index present, no stray flat pages"

      - name: Internal linkcheck
        working-directory: site
        run: python3 ../scripts/migrate/linkcheck.py

      - uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: site/dist
          retention-days: 14
