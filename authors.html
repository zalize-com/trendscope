<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>authors — trendscope</title>
<meta name="description" content="Who keeps shipping things developers care about: most-featured authors across the trendscope daily snapshots.">
<meta property="og:title" content="trendscope authors — most-featured builders">
<meta property="og:image" content="og.png">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📡</text></svg>">
<style>
  :root { --bg:#0d1117; --panel:#161b22; --border:#30363d; --fg:#e6edf3;
          --dim:#8b949e; --accent:#58a6ff; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--fg);
         font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
         max-width: 860px; margin: 0 auto; padding: 28px 18px 60px; }
  a { color: var(--accent); text-decoration: none; } a:hover { text-decoration: underline; }
  nav a { color: var(--dim); font-size: 13px; }
  h1 { font-size: 26px; margin: 14px 0 4px; } h1 span { color: var(--accent); }
  .sub { color: var(--dim); margin-bottom: 18px; }
  table { border-collapse: collapse; width: 100%; margin-top: 8px; }
  th { text-align: left; color: var(--dim); font-size: 11px; text-transform: uppercase;
       letter-spacing: .04em; padding: 6px 10px; border-bottom: 1px solid var(--border); }
  td { padding: 6px 10px; border-bottom: 1px solid var(--border); font-size: 13px; vertical-align: top; }
  .who { font-family: ui-monospace, monospace; color: var(--fg); font-weight: 600; }
  .num { text-align: right; white-space: nowrap; font-family: ui-monospace, monospace; }
  .last { color: var(--dim); font-size: 12px; }
  .last a { color: var(--dim); }
  .srcs { color: var(--dim); font-size: 11px; }
  footer { margin-top: 40px; padding-top: 16px; border-top: 1px solid var(--border); color: var(--dim); font-size: 12px; }
  #err { color: var(--dim); }
</style>
</head>
<body>
  <nav><a href="index.html">← trendscope</a> · <a href="domains.html">domains</a> · <a href="streaks.html">streaks</a></nav>
  <h1>auth<span>ors</span></h1>
  <p class="sub">Most-featured authors &amp; orgs across daily snapshots — grouped by <code>author</code> from <code>data/history.csv</code> · <a href="docs/api/authors.json">↓ json</a></p>
  <div id="out"><p id="err">loading…</p></div>
  <footer>Open data, <a href="https://creativecommons.org/publicdomain/zero/1.0/">CC0</a> ·
    <a href="https://github.com/zalize-com/trendscope">github.com/zalize-com/trendscope</a></footer>
<script type="module">
const esc = s => { const d = document.createElement("div"); d.textContent = s||""; return d.innerHTML; };
const $ = id => document.getElementById(id);

function parseCSV(text) {
  const rows = []; let field = "", row = [], inQ = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQ) {
      if (c === '"') { if (text[i+1] === '"') { field += '"'; i++; } else inQ = false; }
      else field += c;
    } else if (c === '"') inQ = true;
    else if (c === ",") { row.push(field); field = ""; }
    else if (c === "\n") { row.push(field); rows.push(row); row = []; field = ""; }
    else if (c !== "\r") field += c;
  }
  if (field || row.length) { row.push(field); rows.push(row); }
  return rows;
}

const text = await fetch("data/history.csv", {cache:"no-cache"}).then(r => r.text());
const rows = parseCSV(text);
const ci = Object.fromEntries(rows[0].map((h,i)=>[h,i]));

const authors = {};
for (const r of rows.slice(1)) {
  const who = (r[ci.author] || "").trim();
  if (!who) continue;
  const a = authors[who] ||= { hits: 0, days: new Set(), srcs: new Set(), top: null };
  a.hits++; a.days.add(r[ci.date]); a.srcs.add(r[ci.source]);
  const score = Number(r[ci.score]) || 0;
  if (!a.top || score > a.top.score)
    a.top = { title: r[ci.title], url: r[ci.url], score };
}
const list = Object.entries(authors)
  .map(([who, a]) => ({ who, ...a, ndays: a.days.size }))
  .sort((x, y) => y.ndays - x.ndays || y.hits - x.hits)
  .slice(0, 40);

$("out").innerHTML = list.length
  ? `<table><tr><th>author</th><th class="num">days</th><th class="num">items</th><th>sources</th><th>top hit</th></tr>` +
    list.map(a =>
      `<tr><td><span class="who">${esc(a.who)}</span></td>
       <td class="num">${a.ndays}</td><td class="num">${a.hits}</td>
       <td class="srcs">${[...a.srcs].join(", ")}</td>
       <td class="last"><a href="${a.top.url}">${esc(a.top.title.length>70?a.top.title.slice(0,70)+"…":a.top.title)}</a><a href="item.html?q=${encodeURIComponent(a.top.title)}" title="score trajectory" style="color:var(--dim);text-decoration:none;margin-left:4px">⤳</a></td></tr>`).join("") +
    `</table>`
  : `<p id="err">No author data yet — only some sources carry an author field.</p>`;
</script>
</body>
</html>
