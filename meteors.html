<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>meteors — trendscope</title>
  <link rel="search" type="application/opensearchdescription+xml" title="trendscope" href="opensearch.xml">
  <link rel="alternate" type="application/rss+xml" title="trendscope snapshots" href="feed.xml">
  <link rel="alternate" type="application/feed+json" title="trendscope snapshots" href="feed.json">
<meta name="description" content="Meteors: items that burned bright for a single day and never came back — the biggest one-day scores on every source.">
<meta property="og:title" content="meteors — trendscope">
<meta property="og:description" content="One-day wonders: the biggest scores of items seen only once on every tracked source.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://zalize-com.github.io/trendscope/meteors.html">
<meta property="og:image" content="https://zalize-com.github.io/trendscope/og.png">

<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📡</text></svg>">
<style>
  :root { --bg:#0d1117; --fg:#e6edf3; --dim:#8b949e; --border:#21262d; --accent:#58a6ff;
          --green:#3fb950; --orange:#d29922; }
  body { background: var(--bg); color: var(--fg);
         font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
         max-width: 860px; margin: 0 auto; padding: 28px 18px 60px; }
  a { color: var(--accent); text-decoration: none; } a:hover { text-decoration: underline; }
  nav a { color: var(--dim); font-size: 13px; }
  h1 { font-size: 26px; margin: 14px 0 4px; } h1 span { color: var(--accent); }
  .sub { color: var(--dim); margin-bottom: 18px; }
  .stats { display: flex; gap: 18px; flex-wrap: wrap; margin: 10px 0 6px; }
  .stat b { font-size: 22px; } .stat small { color: var(--dim); display: block; font-size: 11px; }
  h2 { font-size: 15px; color: var(--dim); font-weight: 600; margin: 26px 0 6px;
       text-transform: uppercase; letter-spacing: .04em; }
  ol { list-style: none; }
  li { display: flex; gap: 10px; padding: 5px 0; border-bottom: 1px solid var(--border); align-items: baseline; }
  .it a { color: var(--fg); } .it a:hover { color: var(--accent); }
  .sc { margin-left: auto; white-space: nowrap; font-size: 12px; color: var(--dim); }
  .date { color: var(--dim); font-size: 11px; }
  footer { margin-top: 40px; padding-top: 16px; border-top: 1px solid var(--border); color: var(--dim); font-size: 12px; }
  #err { color: var(--dim); }
  .chip { display:inline-block; padding:2px 9px; border:1px solid var(--border); border-radius:12px; font-size:12px; color:var(--fg); text-decoration:none; margin:2px 3px 2px 0; opacity:.75; }
  .chip.on { opacity:1; border-color:var(--accent); color:var(--accent); }
  .bars { display:flex; gap:3px; align-items:flex-end; height:44px; margin:6px 0; }
  .bar { flex:1; background:var(--accent); opacity:.7; border-radius:2px 2px 0 0; min-height:2px; }
  .blabels { display:flex; gap:3px; font-size:9px; color:var(--dim); font-family:ui-monospace,monospace; }
  .blabels span { flex:1; text-align:center; }
</style>
</head>
<body>
  <nav><a href="index.html">← trendscope</a> · <a href="streaks.html">streaks</a> · <a href="risers.html">risers</a></nav>
  <h1>me<span>teors</span></h1>
  <p class="sub">One-day wonders — items seen exactly once on the board, ranked by their single-day score. The vanishing half of the dataset. <a href="docs/api/series.json" style="color:var(--accent)">↓ json</a></p>
  <div id="srcbar" style="margin:8px 0"></div>
  <div class="stats" id="stats"></div>
  <div id="out"><p id="err">loading…</p></div>
  <footer>Open data, <a href="https://creativecommons.org/publicdomain/zero/1.0/">CC0</a> ·
    <a href="https://github.com/zalize-com/trendscope">github.com/zalize-com/trendscope</a></footer>
<script type="module">
const esc = s => { const d = document.createElement("div"); d.textContent = s||""; return d.innerHTML; };
const fmt = n => n >= 1e6 ? (n/1e6).toFixed(1)+"M" : n >= 1e3 ? (n/1e3).toFixed(1)+"k" : String(n);
const $ = id => document.getElementById(id);
try {
  const ser = await fetch("docs/api/series.json", {cache:"no-cache"}).then(r => r.json());
  const meteors = [];
  for (const [url, it] of Object.entries(ser.items)) {
    const ds = Object.keys(it.days);
    if (ds.length !== 1) continue;
    const [score, rank, comments] = it.days[ds[0]];
    meteors.push({ url, title: it.title, source: it.source, metric: it.metric,
                   author: it.author, date: ds[0], score, rank, comments });
  }
  const bySrc = {};
  for (const m of meteors) (bySrc[m.source] = bySrc[m.source] || []).push(m);
  for (const v of Object.values(bySrc)) v.sort((a,b) => b.score - a.score);
  const srcs = Object.entries(bySrc).sort((a,b) => b[1].length - a[1].length);
  const total = meteors.length, all = Object.keys(ser.items).length;
  $("stats").innerHTML =
    `<div class="stat"><b>${total}</b><small>meteors (1-day items)</small></div>
     <div class="stat"><b>${(100*total/all).toFixed(0)}%</b><small>of all ${all} tracked urls</small></div>
     <div class="stat"><b>${srcs.length}</b><small>sources</small></div>`;
  const row = m =>
    `<li><span class="it"><a href="${m.url}">${esc(m.title.length>80?m.title.slice(0,80)+"…":m.title)}</a>` +
      `<a href="item.html?q=${encodeURIComponent(m.title)}" style="color:var(--dim);text-decoration:none;margin-left:4px">⤳</a>
       ${m.author ? `<span class="src">@${esc(m.author)}</span>` : ""}</span>
       <span class="sc">${fmt(m.score)} ${m.metric||""} <span class="date">· ${m.date}</span></span></li>`;
  $("out").innerHTML = srcs.map(([s, ms]) =>
    `<h2>${s} — ${ms.length} meteors</h2><ol>` +
    ms.slice(0,5).map(row).join("") + `</ol>`).join("");
} catch (e) { $("err").textContent = "data unavailable: " + e; }
</script>
</body>
</html>
