<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>API explorer — trendscope</title>
<meta name="description" content="Interactive OpenAPI explorer for the trendscope dataset endpoints — try every API live.">
<meta property="og:title" content="trendscope — API explorer">
<meta property="og:description" content="Swagger UI over the trendscope OpenAPI spec: 28 static endpoints, no keys.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://zalize-com.github.io/trendscope/swagger.html">
<meta property="og:image" content="https://zalize-com.github.io/trendscope/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="favicon-32.png" sizes="32x32">
<link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css">
<style>
body{margin:0 auto;max-width:1100px;padding:14px;font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace}
h1{font-size:20px;margin:4px 0}
.sub{font-size:13px;color:#57606a;margin-bottom:10px}
nav{font-size:13px;margin:8px 0 16px}
nav a{margin-right:8px;color:#0969da;text-decoration:none}
.swagger-ui .topbar{display:none}
#err{color:#cf222e;margin-top:16px}
</style>
</head>
<body>
<h1>API explorer</h1>
<div class="sub">Interactive docs for every trendscope endpoint — static files, no auth, CC0.</div>
<nav><a href="index.html">← board</a><a href="api.html">api guide</a><a href="docs/api.md">api.md</a><a href="docs/api/openapi.yaml">openapi.yaml</a><a href="embeds.html">embeds</a></nav>
<div id="ui"></div>
<div id="err"></div>
<script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
<script>
window.onload = () => {
  try {
    SwaggerUIBundle({
      url: "docs/api/openapi.yaml",
      dom_id: "#ui",
      deepLinking: true,
      tryItOutEnabled: true,
      defaultModelsExpandDepth: 1,
      docExpansion: "list"
    });
  } catch(e){ document.getElementById("err").textContent = "swagger-ui failed to load — " + e.message; }
};
</script>
</body>
</html>
