<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>watch — trendscope</title>
  <link rel="search" type="application/opensearchdescription+xml" title="trendscope" href="opensearch.xml">
  <link rel="alternate" type="application/rss+xml" title="trendscope snapshots" href="feed.xml">
  <link rel="alternate" type="application/feed+json" title="trendscope snapshots" href="feed.json">
<meta name="description" content="Keyword watchlist: save terms and see which of today's fresh board items match, across all 17 sources.">
<meta property="og:title" content="watch — trendscope">
<meta property="og:description" content="Your keywords vs today's board — a personal Google Alerts for the dev attention stream.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://zalize-com.github.io/trendscope/watch.html">
<meta property="og:image" content="https://zalize-com.github.io/trendscope/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📡</text></svg>">
<style>
  :root { --bg:#0d1117; --fg:#e6edf3; --dim:#8b949e; --border:#21262d; --accent:#58a6ff;
          --green:#3fb950; --orange:#d29922; }
  body { background: var(--bg); color: var(--fg);
         font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
         max-width: 860px; margin: 0 auto; padding: 28px 18px 60px; }
  a { color: var(--accent); text-decoration: none; } a:hover { text-decoration: underline; }
  nav a { color: var(--dim); font-size: 13px; }
  h1 { font-size: 26px; margin: 14px 0 4px; } h1 span { color: var(--accent); }
  .sub { color: var(--dim); margin-bottom: 18px; }
  .stats { display: flex; gap: 18px; flex-wrap: wrap; margin: 10px 0 6px; }
  .stat b { font-size: 22px; } .stat small { color: var(--dim); display: block; font-size: 11px; }
  h2 { font-size: 15px; color: var(--dim); font-weight: 600; margin: 26px 0 6px;
       text-transform: uppercase; letter-spacing: .04em; }
  ol { list-style: none; }
  li { display: flex; gap: 10px; padding: 5px 0; border-bottom: 1px solid var(--border); align-items: baseline; }
  .it a { color: var(--fg); } .it a:hover { color: var(--accent); }
  .sc { margin-left: auto; white-space: nowrap; font-size: 12px; color: var(--dim); }
  .date { color: var(--dim); font-size: 11px; }
  footer { margin-top: 40px; padding-top: 16px; border-top: 1px solid var(--border); color: var(--dim); font-size: 12px; }
  #err { color: var(--dim); }
  .chip { display:inline-block; padding:2px 9px; border:1px solid var(--border); border-radius:12px; font-size:12px; color:var(--fg); text-decoration:none; margin:2px 3px 2px 0; opacity:.75; }
  .chip.on { opacity:1; border-color:var(--accent); color:var(--accent); }
  .bars { display:flex; gap:3px; align-items:flex-end; height:44px; margin:6px 0; }
  .bar { flex:1; background:var(--accent); opacity:.7; border-radius:2px 2px 0 0; min-height:2px; }
  .blabels { display:flex; gap:3px; font-size:9px; color:var(--dim); font-family:ui-monospace,monospace; }
  .blabels span { flex:1; text-align:center; }
</style>
</head>
<body>
  <nav><a href="index.html">← trendscope</a> · <a href="radar.html">radar</a> · <a href="new.html">new</a></nav>
  <h1>wa<span>tch</span></h1>
  <p class="sub">Your keywords vs today's board — saved in your browser, matched against every new item.</p>
  <div id="chips" style="margin:8px 0"></div>
  <div style="display:flex;gap:8px;margin:6px 0 14px">
    <input id="kw" type="text" placeholder="add a keyword — e.g. sqlite, llm, rust" style="flex:1;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--fg);padding:6px 10px;font-size:13px">
    <button id="add" style="background:var(--accent);border:none;border-radius:6px;color:#04121f;padding:6px 14px;font-weight:600;cursor:pointer">watch</button>
  </div>
  <div class="stats" id="stats"></div>
  <div id="out"><p id="err">loading…</p></div>
  <footer>Open data, <a href="https://creativecommons.org/publicdomain/zero/1.0/">CC0</a> ·
    <a href="https://github.com/zalize-com/trendscope">github.com/zalize-com/trendscope</a></footer>
<script type="module">
const esc = s => { const d = document.createElement("div"); d.textContent = s||""; return d.innerHTML; };
const fmt = n => n >= 1e6 ? (n/1e6).toFixed(1)+"M" : n >= 1e3 ? (n/1e3).toFixed(1)+"k" : String(n);
const $ = id => document.getElementById(id);
const KEY = "ts-watch";
const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch(e) { return []; } };
const save = l => localStorage.setItem(KEY, JSON.stringify(l));
let kws = load();
function renderChips() {
  $("chips").innerHTML = kws.length
    ? kws.map((k,i) => `<a class="chip" href="#" data-i="${i}" style="text-decoration:none">${esc(k)} ✕</a>`).join("")
    : `<span style="color:var(--dim);font-size:12px">no keywords yet — add one above</span>`;
  $("chips").querySelectorAll("a").forEach(a => a.onclick = e => {
    e.preventDefault(); kws.splice(+a.dataset.i,1); save(kws); run();
  });
}
async function run() {
  renderChips();
  if (!kws.length) { $("out").innerHTML = ""; $("stats").innerHTML = ""; return; }
  const low = kws.map(k => k.toLowerCase());
  const match = t => { t = t.toLowerCase(); return low.filter(k => t.includes(k)); };
  const [nw, latest] = await Promise.all([
    fetch("docs/api/new.json", {cache:"no-cache"}).then(r => r.json()),
    fetch("data/latest.json", {cache:"no-cache"}).then(r => r.json()),
  ]);
  const fresh = nw.items.map(e => ({...e, hit: match(e.title)})).filter(e => e.hit.length);
  const board = Object.values(latest.items).flat().map(e => ({...e, hit: match(e.title)})).filter(e => e.hit.length);
  const freshUrls = new Set(fresh.map(e => e.url));
  const still = board.filter(e => !freshUrls.has(e.url));
  $("stats").innerHTML =
    `<div class="stat"><b>${kws.length}</b><small>watched terms</small></div>
     <div class="stat"><b class="up">${fresh.length}</b><small>new today matching</small></div>
     <div class="stat"><b>${still.length}</b><small>still on the board</small></div>`;
  const row = e =>
    `<li><span class="it"><a href="${e.url}">${esc(e.title.length>85?e.title.slice(0,85)+"…":e.title)}</a><span class="src">${e.source}</span>
     ${e.hit.map(k=>`<span class="chip on" style="margin:0 0 0 4px">${esc(k)}</span>`).join("")}
     <a href="item.html?q=${encodeURIComponent(e.title)}" style="color:var(--dim);text-decoration:none;margin-left:4px">⤳</a></span>
     <span class="sc">${fmt(e.score||0)} ${e.metric||""}</span></li>`;
  $("out").innerHTML =
    `<h2>new today matching your watchlist</h2><ol>` +
      (fresh.map(row).join("") || `<li><span class="it" style="color:var(--dim)">no fresh matches today</span></li>`) + `</ol>` +
    `<h2>still on the board</h2><ol>` +
      (still.slice(0,20).map(row).join("") || `<li><span class="it" style="color:var(--dim)">none</span></li>`) + `</ol>`;
}
$("add").onclick = () => {
  const v = $("kw").value.trim(); if (!v) return;
  for (const k of v.split(",")) { const t = k.trim(); if (t && !kws.includes(t)) kws.push(t); }
  save(kws); $("kw").value = ""; run();
};
$("kw").onkeydown = e => { if (e.key === "Enter") $("add").click(); };
try { await run(); $("err").textContent = ""; }
catch (e) { $("err").textContent = "data unavailable: " + e; }
</script>
</body>
</html>
