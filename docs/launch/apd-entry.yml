description: Daily snapshot of developer attention across 9,200+ public sources: Hacker News, Lobste.rs, Dev.to, GitHub Trending, npm/PyPI/crates.io downloads, 130+ security blogs, ~6,000 individual developer blogs, engineering newsletters and company engineering blogs. Each record carries source, rank, title, canonical URL, a source-normalized score, comments count, tags, author handle and an ISO-8601 capture timestamp. Published as CC0 JSON and CSV: latest.json (full snapshot), latest-lite.json (top-3 per source), daily/*.json.gz archives, append-only history.csv for velocity analysis, plus feeds.json (the 9,202-feed registry with health state), zerowatch.json (persistent-empty detection over consecutive snapshots) and dedup.json (SimHash near-duplicate story clusters). A GitHub Action regenerates the dataset every day and commits it back to the same repository.
