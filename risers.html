<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>risers — trendscope</title>
<meta name="description" content="Biggest single-day score jumps across the whole trendscope dataset — the fastest attention spikes, computed from history.">
<meta property="og:title" content="trendscope risers — biggest single-day spikes">
<meta property="og:image" content="og.png">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📡</text></svg>">
<style>
  :root { --bg:#0d1117; --panel:#161b22; --border:#30363d; --fg:#e6edf3;
          --dim:#8b949e; --accent:#58a6ff; --green:#3fb950; --orange:#d29922; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--fg);
         font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
         max-width: 860px; margin: 0 auto; padding: 28px 18px 60px; }
  a { color: var(--accent); text-decoration: none; } a:hover { text-decoration: underline; }
  nav a { color: var(--dim); font-size: 13px; }
  h1 { font-size: 26px; margin: 14px 0 4px; } h1 span { color: var(--accent); }
  .sub { color: var(--dim); margin-bottom: 18px; }
  .stats { display: flex; gap: 18px; flex-wrap: wrap; margin: 10px 0 6px; }
  .stat b { font-size: 22px; } .stat small { color: var(--dim); display: block; font-size: 11px; }
  h2 { font-size: 15px; color: var(--dim); font-weight: 600; margin: 26px 0 6px;
       text-transform: uppercase; letter-spacing: .04em; }
  ol { list-style: none; }
  li { display: flex; gap: 10px; padding: 5px 0; border-bottom: 1px solid var(--border); align-items: baseline; }
  .it a { color: var(--fg); } .it a:hover { color: var(--accent); }
  .src { color: var(--dim); font-size: 11px; border: 1px solid var(--border);
         border-radius: 4px; padding: 0 5px; margin-left: 6px; }
  .sc { margin-left: auto; white-space: nowrap; font-size: 12px; color: var(--dim); }
  .up { color: var(--green); font-weight: 600; }
  .date { color: var(--dim); font-size: 11px; }
  footer { margin-top: 40px; padding-top: 16px; border-top: 1px solid var(--border); color: var(--dim); font-size: 12px; }
  #err { color: var(--dim); }
  .chip { display:inline-block; padding:2px 9px; border:1px solid var(--border); border-radius:12px; font-size:12px; color:var(--fg); text-decoration:none; margin:2px 3px 2px 0; opacity:.75; }
  .chip.on { opacity:1; border-color:var(--accent); color:var(--accent); }
</style>
</head>
<body>
  <nav><a href="index.html">← trendscope</a> · <a href="streaks.html">streaks</a> · <a href="compare.html">compare</a></nav>
  <h1>r<span>isers</span></h1>
  <p class="sub">The fastest attention spikes: biggest single-day score jumps across <code>data/history.csv</code>.
  Package sources (npm/PyPI/crates) are rolling windows — raw deltas excluded, ranked by rank-jump instead.</p>
  <div id="srcbar" style="margin:8px 0"></div>
  <div class="stats" id="stats"></div>
  <div id="out"><p id="err">loading…</p></div>
  <footer>Open data, <a href="https://creativecommons.org/publicdomain/zero/1.0/">CC0</a> ·
    <a href="https://github.com/zalize-com/trendscope">github.com/zalize-com/trendscope</a></footer>
<script type="module">
const esc = s => { const d = document.createElement("div"); d.textContent = s||""; return d.innerHTML; };
const fmt = n => {
  const s = n < 0 ? "-" : "", a = Math.abs(n);
  return s + (a >= 1e9 ? (a/1e9).toFixed(1)+"B" : a >= 1e6 ? (a/1e6).toFixed(1)+"M" : a >= 1e3 ? (a/1e3).toFixed(1)+"k" : String(a));
};
const $ = id => document.getElementById(id);
const ROLLING = new Set(["npm","pypi","crates"]);

function parseCSV(text) {
  const rows = []; let field = "", row = [], inQ = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQ) {
      if (c === '"') {
        if (text[i+1] === '"') { field += '"'; i++; } else inQ = false;
      } else field += c;
    } else if (c === '"') inQ = true;
    else if (c === ",") { row.push(field); field = ""; }
    else if (c === "\n") { row.push(field); rows.push(row); row = []; field = ""; }
    else if (c !== "\r") field += c;
  }
  if (field || row.length) { row.push(field); rows.push(row); }
  return rows;
}

const text = await fetch("data/history.csv", {cache:"no-cache"}).then(r => r.text());
const rows = parseCSV(text);
const hdr = rows[0];
const ci = Object.fromEntries(hdr.map((h,i)=>[h,i]));

// url -> {title, source, metric, obs: [{date, score, rank}] sorted}
const items = {};
for (const r of rows.slice(1)) {
  const url = r[ci.url]; if (!url) continue;
  const it = items[url] ||= { title: r[ci.title], source: r[ci.source], metric: r[ci.metric], obs: [] };
  it.obs.push({ date: r[ci.date], score: Number(r[ci.score])||0, rank: Number(r[ci.rank])||99 });
}
const allDates = [...new Set(rows.slice(1).map(r => r[ci.date]))].sort();
const latest = allDates[allDates.length-1];
const prevDay = d => new Date(new Date(d+"T00:00:00Z") - 86400000).toISOString().slice(0,10);

// score spikes: only consecutive-day observations, non-rolling sources
const spikes = [];
// rank jumps: consecutive-day, rolling sources (rank decrease = gained places)
const jumps = [];
for (const [url, it] of Object.entries(items)) {
  it.obs.sort((a,b) => a.date < b.date ? -1 : 1);
  for (let i = 1; i < it.obs.length; i++) {
    const p = it.obs[i-1], c = it.obs[i];
    if (prevDay(c.date) !== p.date) continue;
    if (ROLLING.has(it.source)) {
      const j = p.rank - c.rank;
      if (j > 0) jumps.push({ url, ...it, jump: j, from: p.rank, to: c.rank, date: c.date });
    } else {
      const d = c.score - p.score;
      if (d > 0) spikes.push({ url, ...it, delta: d, from: p.score, to: c.score, date: c.date });
    }
  }
}
spikes.sort((a,b) => b.delta - a.delta);
jumps.sort((a,b) => b.jump - a.jump);
const QS = new URLSearchParams(location.search).get("s");
const srcs = [...new Set(Object.values(items).map(i => i.source))].sort();
$("srcbar").innerHTML = srcs.map(s =>
  `<a class="chip${s===QS?" on":""}" href="?s=${encodeURIComponent(s)}">${s}</a>`).join(" ") +
  (QS ? ` <a class="chip" href="?">all</a>` : "");
const sf = e => !QS || e.source === QS;
const spikesF = spikes.filter(sf), jumpsF = jumps.filter(sf);

$("stats").innerHTML =
  `<div class="stat"><b>${latest}</b><small>latest snapshot</small></div>
   <div class="stat"><b>${allDates.length}</b><small>days tracked</small></div>
   <div class="stat"><b class="up">+${spikes.length ? fmt(spikes[0].delta) : 0}</b><small>biggest 1-day spike</small></div>
   <div class="stat"><b>${spikes.length}</b><small>positive single-day deltas</small></div>`;

// sustained climbers: total rise from first to last observation for items
// still on the latest board (non-rolling), longest-first among gainers
const climbers = [];
for (const [url, it] of Object.entries(items)) {
  if (ROLLING.has(it.source) || it.obs.length < 2) continue;
  if (it.obs[it.obs.length-1].date !== latest) continue;
  const gain = it.obs[it.obs.length-1].score - it.obs[0].score;
  if (gain > 0) climbers.push({ url, ...it, gain, days: it.obs.length });
}
climbers.sort((a,b) => b.gain - a.gain);
const climbersF = climbers.filter(sf);
const crow = (e,i) =>
  `<li><span class="sc" style="min-width:16px;text-align:right">${i+1}</span>
   <span class="it"><a href="${e.url}">${esc(e.title)}</a><span class="src">${e.source}</span>
   <a href="item.html?q=${encodeURIComponent(e.title)}" title="score trajectory" style="color:var(--dim);text-decoration:none;margin-left:4px">⤳</a></span>
   <span class="sc"><span class="up">+${fmt(e.gain)}</span> ${e.metric} <span class="date">over ${e.days}d · still on board</span></span></li>`;

const srow = (e,i) =>
  `<li><span class="sc" style="min-width:16px;text-align:right">${i+1}</span>
   <span class="it"><a href="${e.url}">${esc(e.title)}</a><span class="src">${e.source}</span>
   <a href="item.html?q=${encodeURIComponent(e.title)}" title="score trajectory" style="color:var(--dim);text-decoration:none;margin-left:4px">⤳</a></span>
   <span class="sc"><span class="up">+${fmt(e.delta)}</span> ${e.metric} <span class="date">· ${e.date} · ${fmt(e.from)}→${fmt(e.to)}</span></span></li>`;
const jrow = (e,i) =>
  `<li><span class="sc" style="min-width:16px;text-align:right">${i+1}</span>
   <span class="it"><a href="${e.url}">${esc(e.title)}</a><span class="src">${e.source}</span>
   <a href="item.html?q=${encodeURIComponent(e.title)}" title="score trajectory" style="color:var(--dim);text-decoration:none;margin-left:4px">⤳</a></span>
   <span class="sc"><span class="up">▲${e.jump}</span> <span class="date">· ${e.date} · #${e.from}→#${e.to}</span></span></li>`;

$("out").innerHTML =
  `<h2>sustained climbers — still on board today</h2><ol>` +
    (climbersF.slice(0,15).map(crow).join("") || `<li><span class="it" style="color:var(--dim)">none rising right now</span></li>`) + `</ol>` +
  `<h2>biggest single-day spikes (all time)</h2><ol>` +
    (spikesF.slice(0,30).map(srow).join("") || `<li><span class="it" style="color:var(--dim)">no consecutive-day gains in this filter</span></li>`) + `</ol>` +
  `<h2>package rank jumps (rolling sources)</h2><ol>` +
    (jumpsF.slice(0,15).map(jrow).join("") || `<li><span class="it" style="color:var(--dim)">none yet</span></li>`) + `</ol>`;
</script>
</body>
</html>
