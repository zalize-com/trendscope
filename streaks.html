<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>streaks — trendscope</title>
<meta name="description" content="Which stories stay on the board day after day: current and all-time streaks computed from the trendscope dataset history.">
<meta property="og:title" content="trendscope streaks — staying-power leaderboard">
<meta property="og:image" content="og.png">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📡</text></svg>">
<style>
  :root { --bg:#0d1117; --panel:#161b22; --border:#30363d; --fg:#e6edf3;
          --dim:#8b949e; --accent:#58a6ff; --green:#3fb950; --orange:#d29922; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--fg);
         font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
         max-width: 860px; margin: 0 auto; padding: 28px 18px 60px; }
  a { color: var(--accent); text-decoration: none; } a:hover { text-decoration: underline; }
  nav a { color: var(--dim); font-size: 13px; }
  h1 { font-size: 26px; margin: 14px 0 4px; } h1 span { color: var(--accent); }
  .sub { color: var(--dim); margin-bottom: 18px; }
  .stats { display: flex; gap: 18px; flex-wrap: wrap; margin: 10px 0 6px; }
  .stat b { font-size: 22px; } .stat small { color: var(--dim); display: block; font-size: 11px; }
  h2 { font-size: 15px; color: var(--dim); font-weight: 600; margin: 26px 0 6px;
       text-transform: uppercase; letter-spacing: .04em; }
  ol { list-style: none; }
  li { display: flex; gap: 10px; padding: 5px 0; border-bottom: 1px solid var(--border); align-items: baseline; }
  .it a { color: var(--fg); } .it a:hover { color: var(--accent); }
  .src { color: var(--dim); font-size: 11px; border: 1px solid var(--border);
         border-radius: 4px; padding: 0 5px; margin-left: 6px; }
  .sc { margin-left: auto; white-space: nowrap; font-size: 12px; color: var(--dim); }
  .streak { color: var(--orange); font-weight: 600; }
  .cur { color: var(--green); }
  footer { margin-top: 40px; padding-top: 16px; border-top: 1px solid var(--border); color: var(--dim); font-size: 12px; }
  #err { color: var(--dim); }
</style>
</head>
<body>
  <nav><a href="index.html">← trendscope</a> · <a href="compare.html">compare</a> · <a href="digest.html">digests</a></nav>
  <h1>str<span>eaks</span></h1>
  <p class="sub">Staying power: which items keep making the board, computed from <code>data/history.csv</code>.</p>
  <div class="stats" id="stats"></div>
  <div id="out"><p id="err">loading…</p></div>
  <footer>Open data, <a href="https://creativecommons.org/publicdomain/zero/1.0/">CC0</a> ·
    <a href="https://github.com/zalize-com/trendscope">github.com/zalize-com/trendscope</a></footer>
<script type="module">
const esc = s => { const d = document.createElement("div"); d.textContent = s||""; return d.innerHTML; };
const fmt = n => {
  const s = n < 0 ? "-" : "", a = Math.abs(n);
  return s + (a >= 1e9 ? (a/1e9).toFixed(1)+"B" : a >= 1e6 ? (a/1e6).toFixed(1)+"M" : a >= 1e3 ? (a/1e3).toFixed(1)+"k" : String(a));
};
const $ = id => document.getElementById(id);

function parseCSV(text) {
  const rows = []; let field = "", row = [], inQ = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQ) {
      if (c === '"') {
        if (text[i+1] === '"') { field += '"'; i++; } else inQ = false;
      } else field += c;
    } else if (c === '"') inQ = true;
    else if (c === ",") { row.push(field); field = ""; }
    else if (c === "\n") { row.push(field); rows.push(row); row = []; field = ""; }
    else if (c !== "\r") field += c;
  }
  if (field || row.length) { row.push(field); rows.push(row); }
  return rows;
}

const text = await fetch("data/history.csv", {cache:"no-cache"}).then(r => r.text());
const rows = parseCSV(text);
const hdr = rows[0];
const ci = Object.fromEntries(hdr.map((h,i)=>[h,i]));
const items = {};  // url -> {title, source, metric, dates:Set, lastScore, lastRank}
for (const r of rows.slice(1)) {
  const url = r[ci.url]; if (!url) continue;
  const it = items[url] ||= { title: r[ci.title], source: r[ci.source], metric: r[ci.metric], dates: new Set(), lastScore: 0, bestRank: 999 };
  it.dates.add(r[ci.date]);
  it.lastScore = Math.max(it.lastScore, Number(r[ci.score])||0);
  it.bestRank = Math.min(it.bestRank, Number(r[ci.rank])||999);
}
const allDates = [...new Set(rows.slice(1).map(r => r[ci.date]))].sort();
const latest = allDates[allDates.length-1];
const day = 86400000;
const prevDay = d => new Date(new Date(d+"T00:00:00Z") - day).toISOString().slice(0,10);

const recs = Object.entries(items).map(([url, it]) => {
  const ds = [...it.dates].sort();
  // current streak: consecutive days ending at `latest`
  let cur = 0;
  for (let d = latest; it.dates.has(d); d = prevDay(d)) cur++;
  // longest run anywhere
  let run = 1, best = 1;
  for (let i = 1; i < ds.length; i++) {
    run = ds[i-1] === prevDay(ds[i]) ? run + 1 : 1;
    best = Math.max(best, run);
  }
  return { url, ...it, days: ds.length, cur, best };
});

const live = recs.filter(r => r.cur >= 2).sort((a,b) => b.cur - a.cur || b.lastScore - a.lastScore);
const allTime = [...recs].sort((a,b) => b.best - a.best || b.days - a.days || b.lastScore - a.lastScore).slice(0, 15);
const multi = recs.filter(r => r.days >= 2).length;

$("stats").innerHTML =
  `<div class="stat"><b>${latest}</b><small>latest snapshot</small></div>
   <div class="stat"><b>${allDates.length}</b><small>days tracked</small></div>
   <div class="stat"><b class="cur">${live.length}</b><small>on active streak (≥2d)</small></div>
   <div class="stat"><b>${multi}</b><small>repeat appearances</small></div>`;

const row = (r, badge) =>
  `<li><span class="it"><a href="${r.url}">${esc(r.title)}</a><span class="src">${r.source}</span></span>
   <span class="sc">${badge} · ${fmt(r.lastScore)} ${r.metric}</span></li>`;

$("out").innerHTML =
  `<h2>on the board right now (consecutive days)</h2><ol>` +
    (live.length
      ? live.slice(0, 25).map(r => row(r, `<span class="streak">${r.cur}d streak</span>`)).join("")
      : `<li><span class="it" style="color:var(--dim)">nothing on a streak yet — streaks start at 2 consecutive days</span></li>`) + `</ol>` +
  `<h2>longest runs (all time)</h2><ol>` +
    allTime.map(r => row(r, `<span class="streak">${r.best}d</span> <span class="dim">(${r.days}d total)</span>`)).join("") + `</ol>`;
</script>
</body>
</html>
