<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>streaks — trendscope</title>
  <link rel="search" type="application/opensearchdescription+xml" title="trendscope" href="opensearch.xml">
  <link rel="alternate" type="application/rss+xml" title="trendscope snapshots" href="feed.xml">
  <link rel="alternate" type="application/feed+json" title="trendscope snapshots" href="feed.json">
<meta name="description" content="Which stories stay on the board day after day: current and all-time streaks computed from the trendscope dataset history.">
<meta property="og:title" content="trendscope streaks — staying-power leaderboard">
<meta property="og:image" content="https://zalize-com.github.io/trendscope/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📡</text></svg>">
<style>
  :root { --bg:#0d1117; --panel:#161b22; --border:#30363d; --fg:#e6edf3;
          --dim:#8b949e; --accent:#58a6ff; --green:#3fb950; --orange:#d29922; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--fg);
         font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
         max-width: 860px; margin: 0 auto; padding: 28px 18px 60px; }
  a { color: var(--accent); text-decoration: none; } a:hover { text-decoration: underline; }
  nav a { color: var(--dim); font-size: 13px; }
  h1 { font-size: 26px; margin: 14px 0 4px; } h1 span { color: var(--accent); }
  .sub { color: var(--dim); margin-bottom: 18px; }
  .stats { display: flex; gap: 18px; flex-wrap: wrap; margin: 10px 0 6px; }
  .stat b { font-size: 22px; } .stat small { color: var(--dim); display: block; font-size: 11px; }
  h2 { font-size: 15px; color: var(--dim); font-weight: 600; margin: 26px 0 6px;
       text-transform: uppercase; letter-spacing: .04em; }
  ol { list-style: none; }
  li { display: flex; gap: 10px; padding: 5px 0; border-bottom: 1px solid var(--border); align-items: baseline; }
  .it a { color: var(--fg); } .it a:hover { color: var(--accent); }
  .src { color: var(--dim); font-size: 11px; border: 1px solid var(--border);
         border-radius: 4px; padding: 0 5px; margin-left: 6px; }
  .sc { margin-left: auto; white-space: nowrap; font-size: 12px; color: var(--dim); }
  .streak { color: var(--orange); font-weight: 600; }
  .cur { color: var(--green); }
  footer { margin-top: 40px; padding-top: 16px; border-top: 1px solid var(--border); color: var(--dim); font-size: 12px; }
  #err { color: var(--dim); }
  .chip { display:inline-block; padding:2px 9px; border:1px solid var(--border); border-radius:12px; font-size:12px; color:var(--fg); text-decoration:none; margin:2px 3px 2px 0; opacity:.75; }
  .chip.on { opacity:1; border-color:var(--accent); color:var(--accent); }
</style>
</head>
<body>
  <nav><a href="index.html">← trendscope</a> · <a href="compare.html">compare</a> · <a href="digest.html">digests</a></nav>
  <h1>str<span>eaks</span></h1>
  <p class="sub">Staying power: which items keep making the board, computed from <code>data/history.csv</code>.</p>
  <div id="srcbar" style="margin:8px 0"></div>
  <div class="stats" id="stats"></div>
  <div id="out"><p id="err">loading…</p></div>
  <footer>Open data, <a href="https://creativecommons.org/publicdomain/zero/1.0/">CC0</a> ·
    <a href="https://github.com/zalize-com/trendscope">github.com/zalize-com/trendscope</a></footer>
<script type="module">
const esc = s => { const d = document.createElement("div"); d.textContent = s||""; return d.innerHTML; };
const fmt = n => n >= 1e9 ? (n/1e9).toFixed(1)+"B" : n >= 1e6 ? (n/1e6).toFixed(1)+"M" : n >= 1e3 ? (n/1e3).toFixed(1)+"k" : String(n);
const $ = id => document.getElementById(id);
const d = await fetch("docs/api/streaks.json", {cache:"no-cache"}).then(r => r.json());
const recs = d.active.concat(d.longest_all_time);
const live = d.active.slice().sort((a,b) => b.consecutive_days - a.consecutive_days || b.top_score - a.top_score);
const allTime = d.longest_all_time.slice(0, 15);

$("stats").innerHTML =
  `<div class="stat"><b>${d.latest_snapshot}</b><small>latest snapshot</small></div>
   <div class="stat"><b>${d.days_tracked}</b><small>days tracked</small></div>
   <div class="stat"><b class="cur">${d.active_count}</b><small>on active streak (≥2d)</small></div>
   <div class="stat"><b>${d.repeat_appearances}</b><small>repeat appearances</small></div>`;

const row = (r, badge) =>
  `<li><span class="it"><a href="${r.url}">${esc(r.title)}</a><span class="src">${r.source}</span>
   <a href="item.html?q=${encodeURIComponent(r.title)}" title="score trajectory" style="color:var(--dim);text-decoration:none;margin-left:4px">⤳</a></span>
   <span class="sc">${badge} · ${fmt(r.top_score)} ${r.metric||""}</span></li>`;

const srcs = [...new Set(recs.map(r => r.source))].sort();
const QS = new URLSearchParams(location.search).get("s");
$("srcbar").innerHTML = srcs.map(s =>
  `<a class="chip${s===QS?" on":""}" href="?s=${encodeURIComponent(s)}">${s}</a>`).join(" ") +
  (QS ? ` <a class="chip" href="?">all</a>` : "");

const sf = r => !QS || r.source === QS;
const liveF = live.filter(sf), allF = allTime.filter(sf);
$("out").innerHTML =
  `<h2>on the board right now (consecutive days)</h2><ol>` +
    (liveF.length
      ? liveF.slice(0, 25).map(r => row(r, `<span class="streak">${r.consecutive_days}d streak</span>`)).join("")
      : `<li><span class="it" style="color:var(--dim)">nothing on a streak yet — streaks start at 2 consecutive days</span></li>`) + `</ol>` +
  `<h2>longest runs (all time)</h2><ol>` +
    allF.map(r => row(r, `<span class="streak">${r.longest_streak}d</span> <span class="dim">(${r.days_on_board}d total)</span>`)).join("") + `</ol>`;
</script>
</body>
</html>
