<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>compare snapshots — trendscope</title>
<meta name="description" content="Diff any two daily snapshots: what entered the board, what left, and what gained or lost attention.">
<meta property="og:title" content="trendscope compare — snapshot diff">
<meta property="og:image" content="og.png">
<style>
  :root { --bg:#0d1117; --panel:#161b22; --border:#30363d; --fg:#e6edf3;
          --dim:#8b949e; --accent:#58a6ff; --green:#3fb950; --red:#f85149; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--fg);
         font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
         max-width: 860px; margin: 0 auto; padding: 28px 18px 60px; }
  a { color: var(--accent); text-decoration: none; } a:hover { text-decoration: underline; }
  nav a { color: var(--dim); font-size: 13px; }
  h1 { font-size: 26px; margin: 14px 0 4px; } h1 span { color: var(--accent); }
  .sub { color: var(--dim); margin-bottom: 18px; }
  .pick { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 24px; }
  select {
    background: var(--panel); color: var(--fg); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 10px; font: inherit;
  }
  .arrow { color: var(--dim); }
  h2 { font-size: 15px; color: var(--dim); font-weight: 600; margin: 24px 0 6px;
       text-transform: uppercase; letter-spacing: .04em; }
  ol { list-style: none; }
  li { display: flex; gap: 10px; padding: 5px 0; border-bottom: 1px solid var(--border); align-items: baseline; }
  .it a { color: var(--fg); } .it a:hover { color: var(--accent); }
  .src { color: var(--dim); font-size: 11px; border: 1px solid var(--border);
         border-radius: 4px; padding: 0 5px; margin-left: 6px; }
  .sc { margin-left: auto; white-space: nowrap; font-size: 12px; }
  .up { color: var(--green); } .down { color: var(--red); } .dim { color: var(--dim); }
  .stats { display: flex; gap: 18px; flex-wrap: wrap; margin: 10px 0 6px; }
  .stat b { font-size: 22px; } .stat small { color: var(--dim); display: block; font-size: 11px; }
  footer { margin-top: 40px; padding-top: 16px; border-top: 1px solid var(--border); color: var(--dim); font-size: 12px; }
  #err { color: var(--dim); }
</style>
</head>
<body>
  <nav><a href="index.html">← trendscope</a> · <a href="topics.html">topics</a></nav>
  <h1>com<span>pare</span></h1>
  <p class="sub">Diff two daily snapshots: entries, exits and movers.</p>
  <div class="pick">
    <select id="a"></select><span class="arrow">→</span><select id="b"></select>
    <span class="dim" id="meta"></span>
  </div>
  <div class="stats" id="stats"></div>
  <div id="out"><p id="err">loading…</p></div>
  <footer>Open data, <a href="https://creativecommons.org/publicdomain/zero/1.0/">CC0</a> ·
    <a href="https://github.com/zalize-com/trendscope">github.com/zalize-com/trendscope</a></footer>
<script type="module">
const esc = s => { const d = document.createElement("div"); d.textContent = s||""; return d.innerHTML; };
const fmt = n => n >= 1e9 ? (n/1e9).toFixed(1)+"B" : n >= 1e6 ? (n/1e6).toFixed(1)+"M" : n >= 1e3 ? (n/1e3).toFixed(1)+"k" : String(n);
const params = new URLSearchParams(location.search);
const $ = id => document.getElementById(id);

const idx = await fetch("data/index.json", {cache:"no-cache"}).then(r => r.json());
const days = idx.snapshots || [];
const aEl = $("a"), bEl = $("b");
aEl.innerHTML = bEl.innerHTML = days.map(d => `<option>${d}</option>`).join("");
aEl.value = params.get("a") || days[Math.max(0, days.length - 2)];
bEl.value = params.get("b") || days[days.length - 1];
aEl.onchange = bEl.onchange = () => { history.replaceState(null,"",`?a=${aEl.value}&b=${bEl.value}`); run(); };

function row(it, badge, scoreTxt, cls) {
  return `<li><span class="it"><a href="${it.url}">${esc(it.title)}</a><span class="src">${it.source}</span></span>
          <span class="sc">${badge} <span class="${cls}">${scoreTxt}</span></span></li>`;
}

async function run() {
  const [A, B] = [aEl.value, bEl.value];
  $("out").innerHTML = `<p id="err">loading ${A} vs ${B}…</p>`;
  const [sa, sb] = await Promise.all([
    fetch(`data/daily/${A}.json`, {cache:"no-cache"}).then(r => r.json()),
    fetch(`data/daily/${B}.json`, {cache:"no-cache"}).then(r => r.json()),
  ]);
  const mapA = {}, mapB = {};
  Object.values(sa.items||{}).flat().forEach(i => mapA[i.url] = i);
  Object.values(sb.items||{}).flat().forEach(i => mapB[i.url] = i);
  const enter = [], exit = [], movers = [];
  for (const [u, it] of Object.entries(mapB)) {
    if (!mapA[u]) enter.push(it);
    else movers.push({it, d: it.score - mapA[u].score, a: mapA[u].score});
  }
  for (const [u, it] of Object.entries(mapA)) if (!mapB[u]) exit.push(it);
  // relative velocity: score delta normalized by day-A score (new items rank separately)
  movers.forEach(m => m.rel = m.d / Math.max(m.a, 1));
  enter.sort((x,y) => y.score - x.score);
  movers.sort((x,y) => y.d - x.d);
  exit.sort((x,y) => y.score - x.score);
  $("meta").textContent = `${Object.keys(mapA).length} → ${Object.keys(mapB).length} tracked URLs`;
  $("stats").innerHTML =
    `<div class="stat"><b class="up">+${enter.length}</b><small>entered</small></div>
     <div class="stat"><b class="down">−${exit.length}</b><small>left</small></div>
     <div class="stat"><b>${movers.length}</b><small>persisted</small></div>`;
  $("out").innerHTML =
    `<h2>biggest gainers (${B})</h2><ol>` +
      movers.slice(0, 15).map(m =>
        row(m.it, `<span class="dim">${fmt(m.a)} →</span>`, `${m.d>0?"+":""}${fmt(m.d)} ${m.it.metric}`, "up")).join("") + `</ol>` +
    `<h2>new on the board</h2><ol>` +
      enter.slice(0, 15).map(it => row(it, `<span class="dim">new</span>`, `${fmt(it.score)} ${it.metric}`, "up")).join("") + `</ol>` +
    `<h2>biggest droppers</h2><ol>` +
      [...movers].sort((x,y)=>x.d-y.d).slice(0, 10).map(m =>
        row(m.it, `<span class="dim">${fmt(m.a)} →</span>`, `${fmt(m.d)} ${m.it.metric}`, "down")).join("") + `</ol>` +
    `<h2>left the board</h2><ol>` +
      exit.slice(0, 15).map(it => row(it, `<span class="dim">gone</span>`, `${fmt(it.score)} ${it.metric}`, "dim")).join("") + `</ol>`;
}
run().catch(e => { $("err").textContent = "could not load snapshots (check dates)"; });
</script>
</body>
</html>
