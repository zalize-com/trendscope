<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>API — trendscope</title>
<meta name="description" content="Every trendscope endpoint in one place — static JSON/CSV files, no key, no rate limit, CC0.">
<meta property="og:title" content="trendscope data API">
<meta property="og:image" content="og.png">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📡</text></svg>">
<style>
  :root { --bg:#0d1117; --panel:#161b22; --border:#30363d; --fg:#e6edf3;
          --dim:#8b949e; --accent:#58a6ff; --green:#3fb950; --red:#f85149; --orange:#d29922; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--fg);
         font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
         max-width: 860px; margin: 0 auto; padding: 28px 18px 60px; }
  a { color: var(--accent); text-decoration: none; } a:hover { text-decoration: underline; }
  nav a { color: var(--dim); font-size: 13px; }
  h1 { font-size: 26px; margin: 14px 0 4px; } h1 span { color: var(--accent); }
  .sub { color: var(--dim); margin-bottom: 18px; }
  #doc h1 { font-size: 20px; margin: 18px 0 8px; }
  #doc h2, #doc h3 { font-size: 15px; color: var(--dim); margin: 22px 0 8px;
       text-transform: uppercase; letter-spacing: .04em; }
  #doc p { margin: 8px 0; }
  #doc code { font-family: ui-monospace, monospace; font-size: 12px;
       background: var(--panel); border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; }
  #doc pre { background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
       padding: 12px; overflow-x: auto; margin: 10px 0; }
  #doc pre code { border: none; padding: 0; background: none; }
  #doc table { border-collapse: collapse; width: 100%; margin: 12px 0; font-size: 12.5px; }
  #doc td { border: 1px solid var(--border); padding: 5px 8px; vertical-align: top; }
  #doc tr:first-child td { color: var(--dim); font-weight: 600; }
  #doc ul, #doc ol { padding-left: 22px; margin: 8px 0; }
  #doc blockquote { border-left: 3px solid var(--border); padding-left: 12px; color: var(--dim); margin: 10px 0; }
  footer { margin-top: 40px; padding-top: 16px; border-top: 1px solid var(--border); color: var(--dim); font-size: 12px; }
  #err { color: var(--dim); }
</style>
</head>
<body>
  <nav><a href="index.html">← trendscope</a> · <a href="docs/data-dictionary.md">data dictionary</a> · <a href="badges.html">badges</a></nav>
  <h1>a<span>pi</span></h1>
  <p class="sub">Every endpoint is a static file — fetch it from Pages or GitHub raw. This page renders <code>docs/api.md</code> live.</p>
  <div id="doc"><p id="err">loading…</p></div>
  <footer>Open data, <a href="https://creativecommons.org/publicdomain/zero/1.0/">CC0</a> ·
    <a href="https://github.com/zalize-com/trendscope">github.com/zalize-com/trendscope</a></footer>
<script type="module">
const esc = s => { const d = document.createElement("div"); d.textContent = s||""; return d.innerHTML; };
function mdInline(s) {
  s = s.replace(/`([^`]+)`/g, (m, c) => `<code>${c}</code>`);
  s = s.replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/__([^_]+)__/g, "<b>$1</b>");
  s = s.replace(/\*([^*\n]+)\*/g, "<i>$1</i>").replace(/\b_([^_\n]+)_/g, "<i>$1</i>");
  s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+|[^)\s]+)\)/g, '<a href="$2">$1</a>');
  return s;
}
function mdRender(src) {
  const lines = src.split("\n");
  let html = "", inCode = false, list = null, para = [], tbl = null;
  const flushPara = () => { if (para.length) { html += `<p>${mdInline(para.join(" "))}</p>`; para = []; } };
  const flushList = () => { if (list) { html += `</${list}>`; list = null; } };
  const flushTbl = () => { if (tbl) { html += "</table>"; tbl = null; } };
  for (const raw of lines) {
    if (/^```/.test(raw)) {
      flushPara(); flushList(); flushTbl();
      html += inCode ? "</code></pre>" : "<pre><code>";
      inCode = !inCode; continue;
    }
    if (inCode) { html += esc(raw) + "\n"; continue; }
    const t = raw.trimEnd();
    if (!t.trim()) { flushPara(); flushList(); flushTbl(); continue; }
    if (/^\|.+\|$/.test(t)) {
      flushPara(); flushList();
      const cells = t.split("|").slice(1, -1).map(c => c.trim());
      if (cells.every(c => /^:?-+:?$/.test(c))) continue;
      if (!tbl) { tbl = true; html += "<table>"; }
      html += "<tr>" + cells.map(c => `<td>${mdInline(esc(c))}</td>`).join("") + "</tr>";
      continue;
    }
    flushTbl();
    let m;
    if (m = t.match(/^(#{1,6})\s+(.*)/)) {
      flushPara(); flushList();
      const lv = Math.min(m[1].length, 3);
      html += `<h${lv}>${mdInline(esc(m[2]))}</h${lv}>`;
    } else if (/^(-{3,}|\*{3,})$/.test(t)) {
      flushPara(); flushList(); html += "<hr>";
    } else if (m = t.match(/^>|^&gt;/)) {
      flushPara(); flushList();
      html += `<blockquote>${mdInline(esc(t.replace(/^&gt;|^>\s?/, "")))}</blockquote>`;
    } else if (m = t.match(/^[-*+]\s+(.*)/)) {
      flushPara();
      if (list !== "ul") { flushList(); html += "<ul>"; list = "ul"; }
      html += `<li>${mdInline(esc(m[1]))}</li>`;
    } else if (m = t.match(/^\d+[.)]\s+(.*)/)) {
      flushPara();
      if (list !== "ol") { flushList(); html += "<ol>"; list = "ol"; }
      html += `<li>${mdInline(esc(m[1]))}</li>`;
    } else {
      para.push(t);
    }
  }
  flushPara(); flushList(); flushTbl();
  return html;
}
const md = await fetch("docs/api.md", {cache:"no-cache"}).then(r => r.text()).catch(() => null);
document.getElementById("doc").innerHTML = md ? mdRender(md) : '<p id="err">docs/api.md unavailable</p>';
</script>
</body>
</html>
