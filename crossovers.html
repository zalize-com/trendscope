<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>crossovers — trendscope</title>
  <link rel="search" type="application/opensearchdescription+xml" title="trendscope" href="opensearch.xml">
  <link rel="alternate" type="application/rss+xml" title="trendscope snapshots" href="feed.xml">
<meta name="description" content="Items that appeared on multiple source front-pages at once — the stories that escaped a single community.">
<meta property="og:title" content="trendscope crossovers — same story, many communities">
<meta property="og:image" content="https://zalize-com.github.io/trendscope/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📡</text></svg>">
<style>
  :root { --bg:#0d1117; --panel:#161b22; --border:#30363d; --fg:#e6edf3;
          --dim:#8b949e; --accent:#58a6ff; --green:#3fb950; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--fg);
         font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
         max-width: 860px; margin: 0 auto; padding: 28px 18px 60px; }
  a { color: var(--accent); text-decoration: none; } a:hover { text-decoration: underline; }
  nav a { color: var(--dim); font-size: 13px; }
  h1 { font-size: 26px; margin: 14px 0 4px; } h1 span { color: var(--accent); }
  .sub { color: var(--dim); margin-bottom: 18px; }
  h2 { font-size: 15px; color: var(--dim); font-weight: 600; margin: 26px 0 6px;
       text-transform: uppercase; letter-spacing: .04em; }
  ol { list-style: none; }
  li { display: flex; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--border); align-items: baseline; flex-wrap: wrap; }
  .it a { color: var(--fg); } .it a:hover { color: var(--accent); }
  .src { color: var(--dim); font-size: 11px; border: 1px solid var(--border);
         border-radius: 4px; padding: 0 5px; margin-left: 4px; }
  .src.on { color: var(--accent); border-color: var(--accent); }
  .sc { margin-left: auto; white-space: nowrap; font-size: 12px; color: var(--dim); }
  .date { color: var(--dim); font-size: 11px; }
  footer { margin-top: 40px; padding-top: 16px; border-top: 1px solid var(--border); color: var(--dim); font-size: 12px; }
  #err { color: var(--dim); }
  .chip { display:inline-block; padding:2px 9px; border:1px solid var(--border); border-radius:12px; font-size:12px; color:var(--fg); text-decoration:none; margin:2px 3px 2px 0; opacity:.75; }
  .chip.on { opacity:1; border-color:var(--accent); color:var(--accent); }

  /* a11y floor: focus ring + reduced motion (hallmark-style audit 2026-11-16) */
  :focus-visible { outline: 2px solid var(--accent, #58a6ff); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>
  <nav><a href="index.html">← trendscope</a> · <a href="new.html">new</a> · <a href="discuss.html">discussed</a> · <a href="velocity.html">velocity</a></nav>
  <h1>cross<span>overs</span></h1>
  <p class="sub">Items that showed up on <b>2+ different sources</b> in the same window — stories that escaped a single community.
    Filter by source pair · <a href="docs/api/crossovers.json">↓ json</a>.</p>
  <div id="srcbar" style="margin:8px 0"></div>
  <div id="out"><p id="err">loading…</p></div>
  <footer>Open data, <a href="https://creativecommons.org/publicdomain/zero/1.0/">CC0</a> ·
    <a href="https://github.com/zalize-com/trendscope">github.com/zalize-com/trendscope</a></footer>
<script type="module">
const esc = s => { const d = document.createElement("div"); d.textContent = s||""; return d.innerHTML; };
const fmt = n => n>=1e6?(n/1e6).toFixed(1)+"M":n>=1e3?(n/1e3).toFixed(1)+"k":String(n);
const data = await fetch("docs/api/crossovers.json", {cache:"no-cache"}).then(r => r.json()).catch(() => null);
if (!data) { document.getElementById("err").textContent = "could not load docs/api/crossovers.json"; throw 0; }
const xs = data.crossovers || [];
const SRCS = [...new Set(xs.flatMap(x => x.sources))].sort();
const state = { src: null };
const bar = document.getElementById("srcbar");
bar.innerHTML = `<a class="chip on" href="#" data-s="">all</a>` + SRCS.map(s => `<a class="chip" href="#" data-s="${esc(s)}">${esc(s)}</a>`).join("");
bar.addEventListener("click", e => {
  const a = e.target.closest("a[data-s]"); if (!a) return; e.preventDefault();
  state.src = a.dataset.s || null;
  bar.querySelectorAll(".chip").forEach(c => c.classList.toggle("on", c === a));
  render();
});
function render() {
  const list = xs.filter(x => !state.src || x.sources.includes(state.src));
  const out = document.getElementById("out");
  if (!list.length) { out.innerHTML = `<p id="err">no crossovers yet — needs a story on 2+ sources in the same window.</p>`; return; }
  out.innerHTML = `<h2>${list.length} crossovers · snapshot ${esc(data.latest_snapshot)}</h2><ol>` +
    list.map(x => `<li>
      <span class="it"><a href="${esc(x.url)}">${esc(x.title)}</a></span>
      ${x.sources.map(s => `<span class="src${state.src===s?" on":""}">${esc(s)}</span>`).join("")}
      <span class="sc">${x.days}d · best ${fmt(x.best.score)} ${esc(x.best.metric)} on ${esc(x.best.source)} <span class="date">${esc(x.best.date)}</span></span>
    </li>`).join("") + `</ol>`;
}
render();
</script>
</body>
</html>
