<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>status — trendscope</title>
<meta name="description" content="Source health for the trendscope pipeline: per-source uptime, latency and item counts across collection runs.">
<meta property="og:title" content="trendscope status — pipeline health">
<meta property="og:image" content="og.png">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📡</text></svg>">
<style>
  :root { --bg:#0d1117; --panel:#161b22; --border:#30363d; --fg:#e6edf3;
          --dim:#8b949e; --accent:#58a6ff; --green:#3fb950; --red:#f85149; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--fg);
         font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
         max-width: 860px; margin: 0 auto; padding: 28px 18px 60px; }
  a { color: var(--accent); text-decoration: none; } a:hover { text-decoration: underline; }
  nav a { color: var(--dim); font-size: 13px; }
  h1 { font-size: 26px; margin: 14px 0 4px; } h1 span { color: var(--green); }
  .sub { color: var(--dim); margin-bottom: 18px; }
  table { border-collapse: collapse; width: 100%; margin-top: 8px; }
  th { text-align: left; color: var(--dim); font-size: 11px; text-transform: uppercase;
       letter-spacing: .04em; padding: 6px 10px; border-bottom: 1px solid var(--border); }
  td { padding: 6px 10px; border-bottom: 1px solid var(--border); font-size: 13px; vertical-align: top; }
  .src { font-family: ui-monospace, monospace; font-weight: 600; }
  .num { text-align: right; font-family: ui-monospace, monospace; white-space: nowrap; }
  .dot { display:inline-block; width:11px; height:11px; border-radius:2px; margin-right:3px; }
  .ok { background: var(--green); } .bad { background: var(--red); } .none { background: var(--border); }
  .legend { color: var(--dim); font-size: 12px; margin: 6px 0 14px; }
  h2 { font-size: 15px; margin: 22px 0 4px; color: var(--dim); text-transform: uppercase; letter-spacing:.05em; }
  footer { margin-top: 40px; padding-top: 16px; border-top: 1px solid var(--border); color: var(--dim); font-size: 12px; }
  #err { color: var(--dim); }
  .banner { border:1px solid var(--border); border-radius:10px; padding:12px 16px; margin:10px 0 18px; }
</style>
</head>
<body>
  <nav><a href="index.html">← trendscope</a> · <a href="streaks.html">streaks</a> · <a href="compare.html">compare</a> · <a href="digest.html">digests</a></nav>
  <h1>status</h1>
  <p class="sub">Public pipeline health — every collection run logs <code>date,source,ok,items,ms</code> to
    <code>data/health-log.csv</code>. This page renders it.</p>
  <div id="out"><p id="err">loading…</p></div>
  <footer>Open data, <a href="https://creativecommons.org/publicdomain/zero/1.0/">CC0</a> ·
    <a href="https://github.com/zalize-com/trendscope">github.com/zalize-com/trendscope</a></footer>
<script type="module">
const esc = s => { const d = document.createElement("div"); d.textContent = s||""; return d.innerHTML; };
const $ = id => document.getElementById("out");

function parseCSV(text) {
  const rows = []; let field = "", row = [], inQ = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQ) {
      if (c === '"') { if (text[i+1] === '"') { field += '"'; i++; } else inQ = false; }
      else field += c;
    } else if (c === '"') inQ = true;
    else if (c === ",") { row.push(field); field = ""; }
    else if (c === "\n") { row.push(field); rows.push(row); row = []; field = ""; }
    else if (c !== "\r") field += c;
  }
  if (field || row.length) { row.push(field); rows.push(row); }
  return rows;
}

try {
  const txt = await fetch("data/health-log.csv", {cache:"no-cache"}).then(r => r.text());
  const [hdr, ...rs] = parseCSV(txt);
  const ci = Object.fromEntries(hdr.map((h,i)=>[h,i]));
  const runs = rs.map(r => ({date:r[ci.date], source:r[ci.source],
    ok:r[ci.ok]==="1", items:+r[ci.items], ms:+r[ci.ms]}));

  // rollup per source
  const bySrc = {};
  for (const r of runs) {
    const s = bySrc[r.source] ||= {runs:0, ok:0, ms:[], items:[]};
    s.runs++; s.ok += r.ok ? 1 : 0; s.ms.push(r.ms); s.items.push(r.items);
  }
  const days = [...new Set(runs.map(r=>r.date))].sort();
  const totalRuns = runs.length, okRuns = runs.filter(r=>r.ok).length;

  // consecutive all-green days
  const byDay = {};
  for (const r of runs) byDay[r.date] = (byDay[r.date] ?? true) && r.ok;
  let green = 0;
  for (const d of [...days].reverse()) { if (!byDay[d]) break; green++; }

  const allOk = days.length && Object.values(byDay).every(Boolean);
  $.innerHTML = `
    <div class="banner" style="border-color:${allOk ? "var(--green)" : "var(--red)"}">
      ${allOk ? "● all systems operational" : "● degraded"}
      — ${okRuns}/${totalRuns} source-runs green · ${days.length} day${days.length===1?"":"s"} logged
      ${green ? ` · <b style="color:var(--green)">${green} day${green===1?"":"s"} all-green</b>` : ""}
    </div>
    <h2>uptime matrix <span style="text-transform:none">(date × source)</span></h2>
    <div class="legend"><span class="dot ok"></span>ok <span class="dot bad"></span>failed <span class="dot none"></span>no run</div>
    <table><tr><th>source</th>${days.map(d=>`<th>${d.slice(5)}</th>`).join("")}</tr>
      ${Object.keys(bySrc).sort().map(s => `<tr><td class="src">${s}</td>${
        days.map(d => {
          const rr = runs.filter(r => r.date===d && r.source===s);
          const cls = !rr.length ? "none" : rr.every(r=>r.ok) ? "ok" : "bad";
          return `<td><span class="dot ${cls}" title="${rr.map(r=>r.ms+"ms").join(", ")||"—"}"></span></td>`;
        }).join("")}</tr>`).join("")}
    </table>
    <h2>per-source rollup</h2>
    <table><tr><th>source</th><th class="num">uptime</th><th class="num">runs</th>
      <th class="num">avg items</th><th class="num">median ms</th><th class="num">p95 ms</th></tr>
      ${Object.entries(bySrc).sort((a,b)=>a[0].localeCompare(b[0])).map(([s,v]) => {
        const ms = [...v.ms].sort((a,b)=>a-b);
        const med = ms[Math.floor(ms.length/2)], p95 = ms[Math.floor(ms.length*0.95)] || ms[ms.length-1];
        return `<tr><td class="src">${s}</td>
          <td class="num">${(100*v.ok/v.runs).toFixed(0)}%</td>
          <td class="num">${v.runs}</td>
          <td class="num">${(v.items.reduce((a,b)=>a+b,0)/v.items.length).toFixed(1)}</td>
          <td class="num">${med}</td><td class="num">${p95}</td></tr>`;
      }).join("")}
    </table>
    <p class="legend" style="margin-top:14px">npm/PyPI latency is one request per watched package — slower by design.</p>`;
} catch (e) {
  $.innerHTML = `<p id="err">health log not available yet — the pipeline writes it on each daily run.</p>`;
}
</script>
</body>
</html>
