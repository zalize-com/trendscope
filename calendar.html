<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>calendar — trendscope</title>
<meta name="description" content="A month of developer attention at a glance: each day's top item, computed from the trendscope daily snapshot history.">
<meta property="og:title" content="trendscope calendar — the attention month at a glance">
<meta property="og:image" content="og.png">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📡</text></svg>">
<style>
  :root { --bg:#0d1117; --panel:#161b22; --border:#30363d; --fg:#e6edf3;
          --dim:#8b949e; --accent:#58a6ff; --green:#3fb950; --orange:#d29922; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--fg);
         font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
         max-width: 1060px; margin: 0 auto; padding: 28px 18px 60px; }
  a { color: var(--accent); text-decoration: none; } a:hover { text-decoration: underline; }
  nav a { color: var(--dim); font-size: 13px; }
  h1 { font-size: 26px; margin: 14px 0 4px; } h1 span { color: var(--accent); }
  .sub { color: var(--dim); margin-bottom: 18px; }
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
  .dow { color: var(--dim); font-size: 11px; text-transform: uppercase; text-align: center; padding: 4px 0; }
  .cell { background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
          min-height: 108px; padding: 8px; font-size: 12px; overflow: hidden; }
  .cell.empty { background: transparent; border: none; }
  .cell .d { color: var(--dim); font-size: 11px; margin-bottom: 4px; }
  .cell.today { border-color: var(--accent); }
  .cell a { color: var(--fg); display: block; line-height: 1.35; }
  .cell a:hover { color: var(--accent); text-decoration: none; }
  .cell .meta { color: var(--dim); font-size: 10px; margin-top: 4px; }
  .cell .src { color: var(--dim); border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; }
  .cell.none { opacity: .45; }
  footer { margin-top: 40px; padding-top: 16px; border-top: 1px solid var(--border); color: var(--dim); font-size: 12px; }
</style>
</head>
<body>
  <nav><a href="index.html">← trendscope</a> · <a href="week.html">this week</a> · <a href="streaks.html">streaks</a></nav>
  <h1>attention <span>calendar</span></h1>
  <p class="sub" id="sub">Each day's highest-scoring item across all sources — from <code>data/history.csv</code>.</p>
  <div class="grid" id="grid"></div>
  <footer>Open data, <a href="https://creativecommons.org/publicdomain/zero/1.0/">CC0</a> ·
    <a href="https://github.com/zalize-com/trendscope">github.com/zalize-com/trendscope</a></footer>
<script type="module">
const esc = s => { const d = document.createElement("div"); d.textContent = s||""; return d.innerHTML; };
const fmt = n => n >= 1e9 ? (n/1e9).toFixed(1)+"B" : n >= 1e6 ? (n/1e6).toFixed(1)+"M" : n >= 1e3 ? (n/1e3).toFixed(1)+"k" : String(n);

function parseCSV(text) {
  const rows = []; let field = "", row = [], inQ = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQ) {
      if (c === '"') { if (text[i+1] === '"') { field += '"'; i++; } else inQ = false; }
      else field += c;
    } else if (c === '"') inQ = true;
    else if (c === ",") { row.push(field); field = ""; }
    else if (c === "\n") { row.push(field); rows.push(row); row = []; field = ""; }
    else if (c !== "\r") field += c;
  }
  if (field || row.length) { row.push(field); rows.push(row); }
  return rows;
}

const text = await fetch("data/history.csv", {cache:"no-cache"}).then(r => r.text());
const rows = parseCSV(text);
const hdr = rows[0];
const ci = Object.fromEntries(hdr.map((h,i)=>[h,i]));

// per-day winner: highest score among non-rolling sources (downloads skew the view)
const ROLLING = new Set(["npm","pypi","crates"]);
const best = {};
for (const r of rows.slice(1)) {
  if (!r[ci.url] || ROLLING.has(r[ci.source])) continue;
  const d = r[ci.date], sc = Number(r[ci.score]) || 0;
  if (!best[d] || sc > best[d].score)
    best[d] = { score: sc, title: r[ci.title], url: r[ci.url],
                source: r[ci.source], metric: r[ci.metric] || "" };
}
const days = Object.keys(best).sort();
const first = days[0], last = days[days.length-1];
// render the month(s) spanning first→last
const months = [...new Set(days.map(d => d.slice(0,7)))];
const grid = document.getElementById("grid");
grid.innerHTML = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map(d => `<div class="dow">${d}</div>`).join("");
for (const m of months) {
  const [y, mo] = m.split("-").map(Number);
  const nDays = new Date(y, mo, 0).getDate();
  const firstDow = (new Date(y, mo - 1, 1).getDay() + 6) % 7; // Mon=0
  if (months.indexOf(m) > 0) {
    // spacer row between months
    grid.innerHTML += `<div class="dow" style="grid-column:1/-1;text-align:left;padding:10px 0 2px">
      ${new Date(y, mo - 1).toLocaleString("en", {month: "long", year: "numeric"})}</div>`;
  }
  for (let i = 0; i < firstDow; i++) grid.innerHTML += '<div class="cell empty"></div>';
  for (let d = 1; d <= nDays; d++) {
    const ds = `${m}-${String(d).padStart(2,"0")}`;
    const b = best[ds];
    if (!b) { grid.innerHTML += `<div class="cell none"><div class="d">${d}</div></div>`; continue; }
    grid.innerHTML += `<div class="cell${ds === last ? " today" : ""}">
      <div class="d">${d}</div>
      <a href="${esc(b.url)}">${esc(b.title.slice(0, 90))}</a>
      <div class="meta"><span class="src">${b.source}</span> ${fmt(b.score)} ${b.metric}</div></div>`;
  }
}
document.getElementById("sub").innerHTML =
  `Each day's highest-scoring item (packages excluded — download counts skew the view) · ${days.length} days tracked · <code>data/history.csv</code>`;
</script>
</body>
</html>
